pre-commit:
  parallel: true
  commands:
    banned-cast-tokens:
      # R75 / R100.A2. Runs the SAME committed checker the CI banned-casts job
      # runs (scripts/check-r75.js + .github/r75-policy.json), in staged mode so
      # it measures the index that is about to be committed, not unstaged working
      # bytes. The previous inline grep was a second, divergent implementation:
      # it used a different token set, different scan scope, and counted lines
      # rather than occurrences, so the hook and CI disagreed on the same commit.
      # Exit 1 = R75 violation; exit 2 = operational failure (never a silent pass).
      run: node scripts/check-r75.js --mode=staged
    tsc:
      run: npx tsc --noEmit
    eslint:
      # --no-warn-ignored: eslint v10 emits a hard warning when an explicitly
      # passed file matches a global `ignores` entry (e.g. jest.config.js under
      # `**/*.js`). With --max-warnings 0 that fails the hook even though the
      # file was never meant to be linted. The flag restores the pre-v10
      # behaviour of silently skipping ignored inputs; it does not reduce
      # coverage of any file eslint actually lints. CI's `eslint .` is
      # unaffected (it never passes ignored files explicitly).
      run: npx eslint --no-warn-ignored --max-warnings 0 {staged_files}
      glob: '*.{ts,tsx,js,jsx}'
    prettier:
      run: npx prettier --check {staged_files}
      glob: '*.{ts,tsx,js,jsx,json,md,yml,yaml}'
    prod-readiness-quick:
      run: |
        if [ -x scripts/prod-readiness-precheck.sh ]; then
          bash scripts/prod-readiness-precheck.sh --quick
        fi
commit-msg:
  commands:
    no-ai-tokens:
      # R3: block commits whose message includes banned identity tokens
      # (full doctrine token list). Known-good web-standard strings
      # (ai.txt, .well-known/ai*, User-Agent) are scrubbed before scanning
      # so the standalone (ai|agent) word boundary does not false-positive.
      run: |
        MSG=$(cat {1})
        SCRUBBED=$(printf '%s' "$MSG" | sed -E 's|ai\.txt||gI; s|\.well-known/ai[^ ]*||gI; s|User-Agent||gI')
        if printf '%s' "$SCRUBBED" | grep -iqE 'claude|anthropic|openai|gpt[- ]|computer[- ]agent|perplexity|co-authored[- ]by|generated with|🤖|ai assist|\b(ai|agent)\b' ; then
          echo "❌ R3 violation: commit message contains banned identity tokens (Claude/Anthropic/OpenAI/GPT/Computer/Agent/Perplexity/Co-Authored/AI/etc). Operator identity only."
          exit 1
        fi
