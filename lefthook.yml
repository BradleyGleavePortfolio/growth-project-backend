pre-commit:
  parallel: true
  commands:
    banned-cast-tokens:
      run: |
        # R75: fail if any net additions introduce banned cast tokens.
        # Tokens: @ts-ignore, as any, as unknown as, as never,
        # .catch(()=>undefined), .catch(()=>null), .catch(()=>{}), "Coming soon"
        if git diff --cached --unified=0 -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -E '^\+[^+]' | grep -E '(@ts-ignore|\bas\s+any\b|\bas\s+unknown\s+as\b|\bas\s+never\b|\.catch\(\s*\(\s*\)\s*=>\s*(undefined|null|\{\s*\})\)|Coming soon)' ; then
          echo "❌ R75 violation: banned cast tokens in staged diff. Build it right, not bare minimum."
          exit 1
        fi
    tsc:
      run: npx tsc --noEmit
    eslint:
      run: npx eslint --max-warnings 0 {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
    prettier:
      run: npx prettier --check {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml}"
    prod-readiness-quick:
      run: |
        if [ -x scripts/prod-readiness-precheck.sh ]; then
          bash scripts/prod-readiness-precheck.sh --quick
        fi
commit-msg:
  commands:
    no-ai-tokens:
      # R3: block commits whose message includes AI/Claude/Computer/Agent/Co-Authored-by tokens.
      run: |
        if grep -iE '(co-authored-by|claude|computer-agent|generated by ai|/perplexity)' {1} ; then
          echo "❌ R3 violation: commit message contains AI/co-authored tokens. Operator identity only."
          exit 1
        fi
