name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard against committed dist/
        run: |
          if [ -n "$(git ls-files dist/ 2>/dev/null)" ]; then
            echo "ERROR: dist/ is committed. Run: git rm -r --cached dist/"
            exit 1
          fi

      # R45 — the banned hostname t-g-p dot a-p-p must never appear in source.
      # Approved storefront domain is joingrowthproject.com; mobile deep-link
      # is app.trygrowthproject.com. Historical audit artifacts live outside
      # the repo so the grep below scans only tracked sources.
      - name: R45 grep gate (no banned hostname in source)
        run: |
          if git grep -nI 'tgp\.app' -- ':(exclude)package-lock.json' ':(exclude)node_modules'; then
            echo "ERROR: R45 violation — the banned hostname appears in source."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        # Jest's default worker pool plus this repo's suite count overruns
        # Node's ~2GB default heap and OOM-aborts (exit 134) even after the
        # RLS specs are excluded. Raise the heap; the ubuntu-latest runner has
        # ~16GB, so 4GB is comfortably safe.
        run: npm test --if-present
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Confirm the env-validation rules accept a fully-populated prod env.
      # Catches accidental rule additions that would brick the next deploy
      # without the operator updating Fly secrets first.
      - name: Env validation (simulated prod env)
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci/ci
          # DIRECT_URL was promoted to hard tier (PR #238) — required by
          # `prisma migrate deploy` in the Fly release_command. The simulated
          # prod env must supply it so this gate doesn't break boot validation.
          DIRECT_URL: postgres://ci-direct/ci
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-srk
          PUBLIC_INVITE_BASE_URL: https://app.example.com/join
          PUBLIC_WEB_SIGNUP_URL: https://app.example.com/signup
          APP_STORE_URL: https://apps.apple.com/app/id0
          PLAY_STORE_URL: https://play.google.com/store/apps/details?id=ci
          CORS_ORIGINS: https://console.example.com
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          STRIPE_PRICE_ID_FITNESS: price_ci
          SENTRY_DSN: https://ci@sentry.io/1
          # Pre-Connect cleanup made REDIS_URL production-required: a
          # multi-machine Fly deploy with no shared throttler can't defend
          # against credential stuffing. assertEnv refuses prod boot
          # without it, so the simulated-prod gate must supply a value.
          REDIS_URL: redis://ci.example.com:6379
          # Food logger P0 (PR #203) promoted USDA_API_KEY to required:
          # the search path silently returned [] without it, hiding the
          # USDA half of the catalogue from coaches in production. The
          # simulated-prod gate must therefore supply a value.
          USDA_API_KEY: ci-usda-key
          # Release-audit P0 (PR #221) added a prod-hardened gate for
          # the Stripe Checkout redirect URLs: the code defaults to a
          # growthproject:// mobile deep-link, which would break web
          # checkouts in production. assertEnv refuses to boot prod
          # without explicit values, so the simulated-prod gate must
          # supply them too.
          STRIPE_CHECKOUT_SUCCESS_URL: https://app.example.com/checkout/success?session_id={CHECKOUT_SESSION_ID}
          STRIPE_CHECKOUT_CANCEL_URL: https://app.example.com/checkout/cancel
          # ANTHROPIC_API_KEY is prod-hardened: without it client AI guide
          # responses silently fall back to deterministic local content
          # indistinguishable from real AI. assertEnv refuses prod boot
          # without it, so the simulated-prod gate must supply a value.
          ANTHROPIC_API_KEY: sk-ant-ci-test
          # RECENT_AUTH_SECRET / RECENT_AUTH_TTL_MS were promoted to prod
          # tier by the Phase 10 RecentAuthGuard work (pre-PR commit
          # f2581a8d) but the simulated-prod CI env block was never
          # extended, leaving build-and-test red across every open PR.
          # 32-char minimum on the secret; 60000-3600000ms range on the TTL.
          RECENT_AUTH_SECRET: ci-recent-auth-secret-32chars-padding
          RECENT_AUTH_TTL_MS: 900000
          # GUEST_CHECKOUT_PII_SALT was promoted to prod tier by PR #267
          # (storefront guest-checkout PII scrub). Pre-stage the variable
          # in the env-validation gate so #267's merge does not re-break
          # build-and-test the moment it lands.
          GUEST_CHECKOUT_PII_SALT: ci-pii-salt-32chars-minimum-padding
          # STRIPE_PUBLISHABLE_KEY was promoted to prod tier by PR #267
          # (storefront payment confirmation). Pre-staged for the same
          # reason as GUEST_CHECKOUT_PII_SALT.
          STRIPE_PUBLISHABLE_KEY: pk_test_ci
          # R43 storefront — STOREFRONT_BASE_URL, RESEND_FROM_EMAIL,
          # APPLE_TEAM_ID, and ANDROID_CERT_SHA256_FINGERPRINTS are
          # prod-hardened by this PR (#267). Each one's absence in prod
          # would silently misroute traffic (Universal Links, App
          # Links, CORS) or drop welcome mail from an unverified
          # domain. Supply CI stubs so the env-validation gate stays
          # green once this PR lands on main.
          STOREFRONT_BASE_URL: https://storefront.example.com
          RESEND_FROM_EMAIL: 'Growth Project <welcome@trygrowthproject.com>'
          APPLE_TEAM_ID: TEAMID1234
          ANDROID_CERT_SHA256_FINGERPRINTS: 'AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99'
          # KMS_MASTER_KEY was promoted to prod tier by PR #272 (Audit #6
          # P0-4): KmsService.encrypt() falls back to a PLAINTEXT: marker
          # prefix when unset, persisting CRM api_token / api_key /
          # webhook secret values in cleartext. Must be 32 raw bytes
          # base64-encoded. Supply a CI stub so the env-validation gate
          # stays green once this PR lands on main.
          KMS_MASTER_KEY: dGVzdC1rZXktMzItYnl0ZXMtZm9yLXVuaXQtdGVzdGluZw==
          # LANDING_VIEW_HASH_SECRET was promoted to prod tier by PR #272
          # (Audit #6 P1-2): LandingPagesPublicService.dailySalt() falls
          # back to a hard-coded 'landing-views-daily-salt' constant when
          # unset, making the per-visitor hash predictable and trivially
          # re-identifiable.
          LANDING_VIEW_HASH_SECRET: ci-landing-view-hash-secret-32chars-padding
          # CHECKOUT_RECOVERY_SECRET was promoted to prod tier with a 43-char
          # floor (RFC 7518 §3.2) by fix-3-env (audit A276-F3-P2-1). Signs the
          # 15-minute checkout recovery JWT AND the 7-day guest session cookie.
          # The simulated-prod env-validation gate must supply a ≥43-char value.
          CHECKOUT_RECOVERY_SECRET: ci-checkout-recovery-secret-43chars-base64url-pad
          # Stream 1 (PR #298) promoted COACH_AI_MAX_ACTUAL_CENTS and
          # COACH_AI_VALUE_MULTIPLIER to prod tier: assertEnv refuses prod
          # boot without explicit values so a deploy-time typo cannot
          # silently revert the hard $40 cap or the locked 3.125× display
          # multiplier to a stale default. Supply CI stubs so this gate
          # stays green once Stream 1 is on main. Refs:
          # STREAM_1_AI_CREDITS_SPEC.md §0.
          COACH_AI_MAX_ACTUAL_CENTS: '4000'
          COACH_AI_VALUE_MULTIPLIER: '3.125'
        run: node -e "require('./dist/common/env-validation').assertEnv()"

  rls-floor-guard:
    # PR-RLS-01 (audit P1-002): the relrowsecurity floor guard must be
    # called by an actual workflow step or it protects nothing. The script
    # itself is soft until RLS_ENFORCEMENT_FULL is flipped to 'on' after
    # PR-RLS-08 lands, but it MUST be invoked unconditionally so the gate
    # exists and the table-count trends are surfaced in CI logs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install postgresql-client
        # Required by scripts/ci/check-relrowsecurity.sh. Once
        # RLS_ENFORCEMENT_FULL=on, the script hard-fails if psql is missing
        # (audit P2-007); installing it here keeps the guard meaningful.
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: RLS floor guard (soft until PR-RLS-08)
        env:
          # DATABASE_URL_AUDIT is a read-only Postgres URL to the project
          # whose floor we want to measure. The script soft-skips when this
          # secret is unset, so CI stays green for forks without secrets.
          DATABASE_URL: ${{ secrets.DATABASE_URL_AUDIT }}
          # Flip to 'on' in the workflow after PR-RLS-08 merges and the
          # advisor returns zero rls_disabled_in_public lints.
          RLS_ENFORCEMENT_FULL: 'off'
        run: bash scripts/ci/check-relrowsecurity.sh

  rls-live-tests:
    # PR-RLS-01 (audit R1-P1-002): the live RLS helper regression suite was
    # skipped in the default PR gate because build-and-test runs `npm test`
    # with no TEST_DATABASE_URL, so every behavioral RLS assertion
    # (positive/negative helper paths, ACL lockdown, trigger cap, hostile
    # search_path + pg_temp relation-shadow) was silently skipped.
    #
    # This job provisions a real Postgres 15 service container, applies the
    # Supabase CI shim + a scoped RLS-01 bootstrap + the PR-RLS-01 migration,
    # exports TEST_DATABASE_URL, and runs only test/rls. The suite HARD-FAILS
    # (not skips) if the DB is configured-but-unreachable, so a broken DB can
    # never read as green.
    #
    # NOTE on schema setup: the full Prisma migration chain is NOT deployable
    # from empty on this repo (a pre-existing, out-of-PR-scope defect —
    # 20250724120000 ALTERs SubCoachInvite before 20260604000000 creates it).
    # So instead of `prisma migrate deploy` over the whole history, we
    # materialize only the objects PR-RLS-01 touches (scripts/ci/*.sql) and
    # then apply THIS PR's migration verbatim, so the live suite asserts
    # against the real migration output. See scripts/ci/rls01-live-bootstrap.sql.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait for the container to accept connections before steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both URLs point at the service container. DIRECT_URL is what
      # `prisma migrate deploy` uses; TEST_DATABASE_URL is what the live
      # suite connects with.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Supabase CI shim (roles + auth.uid)
        # Vanilla Postgres has no anon/authenticated/service_role roles and no
        # auth schema; the shim creates them so the migration's GRANTs to those
        # roles apply cleanly. CI-only — never run against a real Supabase DB.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/supabase-shim.sql

      - name: Bootstrap RLS-01 schema (User + TeamSubCoachAssignment + dep helper)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/rls01-live-bootstrap.sql

      - name: Apply the PR-RLS-01 migration (the five hardened helpers)
        # Apply THIS PR's migration verbatim so the live suite asserts against
        # the real migration output, not a copy.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260704000000_rls01_helper_searchpath_hibp/migration.sql

      - name: Bind the head-cap trigger
        # CREATE OR REPLACE FUNCTION in the migration preserves an existing
        # trigger binding by OID in production, but a fresh CI DB has no prior
        # trigger, so create it here against the hardened function.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            'CREATE TRIGGER trg_enforce_subcoach_head_cap BEFORE INSERT OR UPDATE ON "TeamSubCoachAssignment" FOR EACH ROW EXECUTE FUNCTION enforce_subcoach_head_cap();'

      - name: Run live RLS regression suite
        # Use the dedicated rls-live jest config (jest.rls.config.js), which
        # selects the DB-requiring RLS specs the default build-and-test job now
        # excludes. We still pass an explicit path filter so this job runs ONLY
        # the PR-RLS-01 helper suite: the other test/rls-*.spec.ts policy suites
        # need the full schema this scoped bootstrap does not build (see the
        # bootstrap steps above), so they stay out until that bootstrap grows.
        # --runInBand so the GUC/search_path session state is not interleaved
        # across workers on one connection. NODE_OPTIONS raises the heap: even
        # this single spec under --runInBand overruns Node's ~2GB default and
        # OOM-aborts (exit 134); the runner has ~16GB so 4GB is safe.
        run: npx jest --config jest.rls.config.js test/rls/helper-functions.spec.ts --runInBand --testTimeout=60000
        env:
          NODE_OPTIONS: --max-old-space-size=4096
