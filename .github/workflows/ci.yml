        # MWB3_TEST_DATABASE_URL gate and reset + full-schema bootstrap.
        run: npx jest test/roman/r11-memory-schema.live.spec.ts --runInBand --testTimeout=120000
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run Roman spend admission live spec (#651 B-651-5)
        # test/roman/roman-spend-admission.live.spec.ts: on real Postgres,
