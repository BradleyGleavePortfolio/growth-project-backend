name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard against committed dist/
        run: |
          if [ -n "$(git ls-files dist/ 2>/dev/null)" ]; then
            echo "ERROR: dist/ is committed. Run: git rm -r --cached dist/"
            exit 1
          fi

      # R45 — the banned hostname t-g-p dot a-p-p must never appear in source.
      # Approved storefront domain is joingrowthproject.com; mobile deep-link
      # is app.trygrowthproject.com. Historical audit artifacts live outside
      # the repo so the grep below scans only tracked sources.
      - name: R45 grep gate (no banned hostname in source)
        run: |
          if git grep -nI 'tgp\.app' -- ':(exclude)package-lock.json' ':(exclude)node_modules'; then
            echo "ERROR: R45 violation — the banned hostname appears in source."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      # Confirm the env-validation rules accept a fully-populated prod env.
      # Catches accidental rule additions that would brick the next deploy
      # without the operator updating Fly secrets first.
      - name: Env validation (simulated prod env)
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci/ci
          # DIRECT_URL was promoted to hard tier (PR #238) — required by
          # `prisma migrate deploy` in the Fly release_command. The simulated
          # prod env must supply it so this gate doesn't break boot validation.
          DIRECT_URL: postgres://ci-direct/ci
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-srk
          PUBLIC_INVITE_BASE_URL: https://app.example.com/join
          PUBLIC_WEB_SIGNUP_URL: https://app.example.com/signup
          APP_STORE_URL: https://apps.apple.com/app/id0
          PLAY_STORE_URL: https://play.google.com/store/apps/details?id=ci
          CORS_ORIGINS: https://console.example.com
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          STRIPE_PRICE_ID_FITNESS: price_ci
          SENTRY_DSN: https://ci@sentry.io/1
          # Pre-Connect cleanup made REDIS_URL production-required: a
          # multi-machine Fly deploy with no shared throttler can't defend
          # against credential stuffing. assertEnv refuses prod boot
          # without it, so the simulated-prod gate must supply a value.
          REDIS_URL: redis://ci.example.com:6379
          # Food logger P0 (PR #203) promoted USDA_API_KEY to required:
          # the search path silently returned [] without it, hiding the
          # USDA half of the catalogue from coaches in production. The
          # simulated-prod gate must therefore supply a value.
          USDA_API_KEY: ci-usda-key
          # Release-audit P0 (PR #221) added a prod-hardened gate for
          # the Stripe Checkout redirect URLs: the code defaults to a
          # growthproject:// mobile deep-link, which would break web
          # checkouts in production. assertEnv refuses to boot prod
          # without explicit values, so the simulated-prod gate must
          # supply them too.
          STRIPE_CHECKOUT_SUCCESS_URL: https://app.example.com/checkout/success?session_id={CHECKOUT_SESSION_ID}
          STRIPE_CHECKOUT_CANCEL_URL: https://app.example.com/checkout/cancel
          # ANTHROPIC_API_KEY is prod-hardened: without it client AI guide
          # responses silently fall back to deterministic local content
          # indistinguishable from real AI. assertEnv refuses prod boot
          # without it, so the simulated-prod gate must supply a value.
          ANTHROPIC_API_KEY: sk-ant-ci-test
          # RECENT_AUTH_SECRET / RECENT_AUTH_TTL_MS were promoted to prod
          # tier by the Phase 10 RecentAuthGuard work (pre-PR commit
          # f2581a8d) but the simulated-prod CI env block was never
          # extended, leaving build-and-test red across every open PR.
          # 32-char minimum on the secret; 60000-3600000ms range on the TTL.
          RECENT_AUTH_SECRET: ci-recent-auth-secret-32chars-padding
          RECENT_AUTH_TTL_MS: 900000
          # GUEST_CHECKOUT_PII_SALT was promoted to prod tier by PR #267
          # (storefront guest-checkout PII scrub). Pre-stage the variable
          # in the env-validation gate so #267's merge does not re-break
          # build-and-test the moment it lands.
          GUEST_CHECKOUT_PII_SALT: ci-pii-salt-32chars-minimum-padding
          # STRIPE_PUBLISHABLE_KEY was promoted to prod tier by PR #267
          # (storefront payment confirmation). Pre-staged for the same
          # reason as GUEST_CHECKOUT_PII_SALT.
          STRIPE_PUBLISHABLE_KEY: pk_test_ci
          # R43 storefront — STOREFRONT_BASE_URL, RESEND_FROM_EMAIL,
          # APPLE_TEAM_ID, and ANDROID_CERT_SHA256_FINGERPRINTS are
          # prod-hardened by this PR (#267). Each one's absence in prod
          # would silently misroute traffic (Universal Links, App
          # Links, CORS) or drop welcome mail from an unverified
          # domain. Supply CI stubs so the env-validation gate stays
          # green once this PR lands on main.
          STOREFRONT_BASE_URL: https://storefront.example.com
          RESEND_FROM_EMAIL: 'Growth Project <welcome@trygrowthproject.com>'
          APPLE_TEAM_ID: TEAMID1234
          ANDROID_CERT_SHA256_FINGERPRINTS: 'AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99'
          # KMS_MASTER_KEY was promoted to prod tier by PR #272 (Audit #6
          # P0-4): KmsService.encrypt() falls back to a PLAINTEXT: marker
          # prefix when unset, persisting CRM api_token / api_key /
          # webhook secret values in cleartext. Must be 32 raw bytes
          # base64-encoded. Supply a CI stub so the env-validation gate
          # stays green once this PR lands on main.
          KMS_MASTER_KEY: dGVzdC1rZXktMzItYnl0ZXMtZm9yLXVuaXQtdGVzdGluZw==
          # LANDING_VIEW_HASH_SECRET was promoted to prod tier by PR #272
          # (Audit #6 P1-2): LandingPagesPublicService.dailySalt() falls
          # back to a hard-coded 'landing-views-daily-salt' constant when
          # unset, making the per-visitor hash predictable and trivially
          # re-identifiable.
          LANDING_VIEW_HASH_SECRET: ci-landing-view-hash-secret-32chars-padding
        run: node -e "require('./dist/common/env-validation').assertEnv()"
