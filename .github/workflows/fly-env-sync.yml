name: Fly Env Sync (operator)

# S-ENVTRUTH. Operator workflow that copies an explicit allowlist of GitHub
# Actions secrets to the production Fly app with `fly secrets set --stage`.
#
# Why --stage: staged secrets do NOT restart machines. They are applied at the
# next `fly deploy` (or an explicit `fly secrets deploy`), so this workflow can
# run during the day without bouncing production.
#
# What it does:
#   1. Guards: app allowlist, confirm=SET, `production` environment (same
#      pattern as fly-secrets-set.yml), FLY_API_TOKEN present.
#   2. For every allowlisted name, reads the GitHub secret of the SAME name.
#      Unset or empty secrets are SKIPPED (never pushed as empty, never fail
#      the run) so the operator can fill the list in over time.
#   3. Stages the non-empty ones in one `fly secrets set --stage` call.
#   4. Confirms the staged names appear in `fly secrets list --json` (the
#      structured listing; jq projects name + status only) and prints
#      NAMES + STATUS ONLY (no digests, no values).
#
# Optional apply (deploy_staged=true): after staging, runs `fly secrets deploy`
# so the staged values take effect immediately (rolling machine restart).
# Off by default; when off, the next `fly deploy` applies them.
#
# What it does NOT do:
#   - It does not deploy or restart machines unless deploy_staged=true.
#   - It does not generate, rotate or delete any secret.
#   - It does not print any value. `set +x` everywhere; values only ever live in
#     env vars and the argv array handed to flyctl.
#   - It does not push the Apple sign-in keys; the account-deletion lane's own
#     workflow owns those.
#
# Every allowlisted name must be registered in src/common/env-validation.ts;
# test/ci/fly-env-workflows.spec.ts enforces that plus the guards above.
#
# How to run (operator):
#   gh workflow run "Fly Env Sync (operator)" -f app=backend-spring-lake-3890 -f confirm=SET
#   # stage and apply now (rolling restart):
#   gh workflow run "Fly Env Sync (operator)" -f app=backend-spring-lake-3890 -f confirm=SET -f deploy_staged=true

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production)
        required: true
        default: backend-spring-lake-3890
      confirm:
        description: Type SET to confirm you intend to stage production secrets
        required: true
        default: ''
      deploy_staged:
        description: Also run `fly secrets deploy` after staging (restarts machines to apply now). Default false = apply at the next deploy.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fly-env-sync:
    name: Stage allowlisted secrets on Fly
    runs-on: ubuntu-latest
    environment: production
    concurrency: fly-secrets-${{ inputs.app }}
    steps:
      - name: Validate Fly app target
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          case "${APP}" in
            backend-spring-lake-3890) ;;
            *)
              echo "::error::The app input is not an allowed Fly app target, so nothing was staged. This workflow only manages backend-spring-lake-3890. Fix: re-run with -f app=backend-spring-lake-3890."
              exit 1
              ;;
          esac
          echo "App target allowed."

      - name: Confirm operator intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "SET" ]; then
            echo "::error::The confirm input is not the literal string SET, so nothing was staged. Fix: re-run with -f confirm=SET once you intend to stage production secrets."
            exit 1
          fi
          echo "Operator confirmed."

      - name: Check Fly token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::The FLY_API_TOKEN secret is empty or not set, so flyctl cannot manage secrets and nothing was staged. Fix: create a deploy token with 'fly tokens create deploy -a backend-spring-lake-3890', save it as the FLY_API_TOKEN secret available to the production environment, then re-run."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured."

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master 2026-09-20 (pinned)

      - name: Stage allowlisted secrets (names only in output)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          # BEGIN ALLOWLIST (each maps to the GitHub secret of the same name)
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
          DATA_EXPORT_DOWNLOAD_SECRET: ${{ secrets.DATA_EXPORT_DOWNLOAD_SECRET }}
          CONTRACT_PDF_URL_SECRET: ${{ secrets.CONTRACT_PDF_URL_SECRET }}
          SCHEDULING_WEBHOOK_SECRET: ${{ secrets.SCHEDULING_WEBHOOK_SECRET }}
          GARMIN_WEBHOOK_SALT: ${{ secrets.GARMIN_WEBHOOK_SALT }}
          WHOOP_WEBHOOK_SALT: ${{ secrets.WHOOP_WEBHOOK_SALT }}
          FITBIT_CLIENT_ID: ${{ secrets.FITBIT_CLIENT_ID }}
          FITBIT_CLIENT_SECRET: ${{ secrets.FITBIT_CLIENT_SECRET }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WAHOO_CLIENT_ID: ${{ secrets.WAHOO_CLIENT_ID }}
          WAHOO_CLIENT_SECRET: ${{ secrets.WAHOO_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          # END ALLOWLIST
        run: |
          set +x
          set -euo pipefail
          allowlist=(
            GOOGLE_CLIENT_IDS
            GOOGLE_OAUTH_CLIENT_ID
            GOOGLE_OAUTH_CLIENT_SECRET
            GOOGLE_OAUTH_REDIRECT_URI
            METRICS_AUTH_TOKEN
            DATA_EXPORT_DOWNLOAD_SECRET
            CONTRACT_PDF_URL_SECRET
            SCHEDULING_WEBHOOK_SECRET
            GARMIN_WEBHOOK_SALT
            WHOOP_WEBHOOK_SALT
            FITBIT_CLIENT_ID
            FITBIT_CLIENT_SECRET
            GARMIN_CLIENT_ID
            GARMIN_CLIENT_SECRET
            OURA_CLIENT_ID
            OURA_CLIENT_SECRET
            POLAR_CLIENT_ID
            POLAR_CLIENT_SECRET
            STRAVA_CLIENT_ID
            STRAVA_CLIENT_SECRET
            WAHOO_CLIENT_ID
            WAHOO_CLIENT_SECRET
            WHOOP_CLIENT_ID
            WHOOP_CLIENT_SECRET
            WITHINGS_CLIENT_ID
            WITHINGS_CLIENT_SECRET
          )
          args=()
          staged=()
          skipped=()
          for name in "${allowlist[@]}"; do
            # Indirect expansion reads the value without ever printing it.
            if [ -n "${!name:-}" ]; then
              args+=("${name}=${!name}")
              staged+=("${name}")
            else
              skipped+=("${name}")
            fi
          done
          printf 'skipped (unset or empty in GitHub secrets): %s\n' "${skipped[*]:-none}"
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "Nothing to stage."
            exit 0
          fi
          printf 'staging: %s\n' "${staged[*]}"
          # --stage: no machine restart; applied at the next deploy. stdout is
          # discarded; stderr is kept only to surface flyctl's own error line.
          set +e
          flyctl secrets set --stage -a "${APP}" "${args[@]}" > /dev/null 2> fly-set-stderr.txt
          rc=$?
          set -e
          unset args
          if [ "${rc}" -ne 0 ]; then
            echo "::error::flyctl secrets set --stage failed (exit ${rc}) for: ${staged[*]}. Nothing was applied to running machines. Fix: check that FLY_API_TOKEN is a valid token for ${APP} ('fly tokens create deploy -a ${APP}') and that the Fly API is reachable, then re-run; staging the same values again is safe."
            # flyctl's error lines only, with anything after '=' redacted.
            grep -E '^(Error|error)' fly-set-stderr.txt | sed -E 's/=[^[:space:]]*/=<redacted>/g' | head -n 5 || true
            rm -f fly-set-stderr.txt
            exit 1
          fi
          rm -f fly-set-stderr.txt
          printf '%s\n' "${staged[@]}" > staged-names.txt
          echo "Staged ${#staged[@]} secret(s). They apply at the next deploy, or now when deploy_staged=true."

      - name: Confirm staged names are listed on Fly (names and status only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set +x
          set -euo pipefail
          if [ ! -s staged-names.txt ]; then
            echo "No staged names to confirm."
            exit 0
          fi
          if ! command -v jq > /dev/null 2>&1; then
            echo "::error::jq is not installed on this runner, so the staged names cannot be confirmed (the stage step already succeeded). Fix: run on ubuntu-latest, which ships jq, or add a jq install step, then re-run; staging the same values again is safe."
            exit 1
          fi
          # Structured listing (B-624-1): `--json` gives each secret's bare name
          # (the table prefixes staged names with "* " and partial ones with
          # "! "). jq projects name + status word only, so digests never reach
          # a variable, the log or a file. Error codes are fixed strings.
          filter='if type != "array" then error("ENVSYNC_NOT_ARRAY") else .[] | if type != "object" then error("ENVSYNC_ENTRY_NOT_OBJECT") else [(.name // .Name), ((.status // .Status // "Unknown") | tostring)] | if (.[0] | type) != "string" or .[0] == "" then error("ENVSYNC_ENTRY_NO_NAME") else @tsv end end end'
          listed=$(
            set +e
            flyctl secrets list -a "${APP}" --json 2> fly-list-stderr.txt | jq -r "${filter}" 2> jq-stderr.txt
            echo "${PIPESTATUS[0]} ${PIPESTATUS[1]}" > list-status.txt
          )
          read -r fly_rc jq_rc < list-status.txt
          if [ "${fly_rc}" -ne 0 ]; then
            echo "::error::flyctl secrets list --json failed (exit ${fly_rc}) for ${APP}, so the staged names could not be confirmed. The stage step already succeeded and nothing was applied to running machines. Fix: check that FLY_API_TOKEN is a valid token for ${APP} and that the Fly API is reachable, then re-run; staging the same values again is safe. flyctl said:"
            grep -E '^(Error|error)' fly-list-stderr.txt | head -n 5 || true
            exit 1
          fi
          if [ "${jq_rc}" -ne 0 ]; then
            code=$(grep -oE 'ENVSYNC_[A-Z_]+' jq-stderr.txt | head -n 1 || true)
            echo "::error::flyctl secrets list --json did not return a JSON array of objects with a string name field (${code:-ENVSYNC_INVALID_JSON}), so the staged names could not be confirmed. The stage step already succeeded. Fix: the installed flyctl changed its JSON output; pin a flyctl version in the setup-flyctl step or update the jq filter in this step, then re-run."
            exit 1
          fi
          rm -f fly-list-stderr.txt jq-stderr.txt list-status.txt
          missing=()
          report=()
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            status=$(printf '%s\n' "${listed}" | awk -F'\t' -v n="${name}" '$1 == n { print $2; exit }')
            if [ -z "${status}" ]; then
              missing+=("${name}")
            else
              report+=("${name}: ${status}")
            fi
          done < staged-names.txt
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::These names were staged but are not listed on Fly: ${missing[*]}. Fix: re-run this workflow (staging the same values again is safe); if they are still missing, run 'fly secrets list -a ${APP}' and look for a flyctl error in the stage step above."
            exit 1
          fi
          echo "All staged names are listed on Fly (Staged = applies at the next deploy or with deploy_staged=true; Partial = a rolling deploy is in progress; Deployed = already live):"
          printf '%s\n' "${report[@]}"

      - name: Apply staged secrets now (only when deploy_staged=true)
        if: ${{ inputs.deploy_staged }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set +x
          set -euo pipefail
          if [ ! -s staged-names.txt ]; then
            echo "Nothing was staged; skipping fly secrets deploy."
            exit 0
          fi
          # Rolling restart that applies the staged secrets. Output is names /
          # machine ids only; flyctl never prints secret values.
          set +e
          flyctl secrets deploy -a "${APP}"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "::error::flyctl secrets deploy failed (exit ${rc}) for ${APP}. The secrets stay staged and the next fly deploy applies them. Fix: check machine health with 'fly status -a ${APP}' and 'fly logs -a ${APP}', then re-run this workflow with deploy_staged=true (staging the same values again is safe) or let the next normal deploy apply them."
            exit 1
          fi
          echo "Staged secrets applied."
