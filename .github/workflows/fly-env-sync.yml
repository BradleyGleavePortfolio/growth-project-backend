            (
              set +e
              flyctl secrets list -a "${APP}" --json 2> fly-list-stderr.txt | jq -r "${filter}" > "$1" 2> jq-stderr.txt
              echo "${PIPESTATUS[0]} ${PIPESTATUS[1]}" > list-status.txt
            )
            read -r fly_rc jq_rc < list-status.txt
            if [ "${fly_rc}" -ne 0 ]; then
              cls=$(fly_error_class fly-list-stderr.txt)
              echo "::error::flyctl secrets list --json failed (exit ${fly_rc}, error class ${cls}) for ${APP}, so $2. flyctl's own error text is withheld from this log. $(fly_error_hint "${cls}")"
              return 1
            fi
            if [ "${jq_rc}" -ne 0 ]; then
              code=$(grep -oE 'ENVSYNC_[A-Z_]+' jq-stderr.txt | head -n 1 || true)
              echo "::error::flyctl secrets list --json did not return a JSON array of objects with a string name field (${code:-ENVSYNC_INVALID_JSON}), so $2. Fix: the installed flyctl changed its JSON output; pin a flyctl version in the setup-flyctl step or update the jq filter in fly_list_state, then re-run."
              return 1
            fi
          }
          # In-machine value check. `prepare` builds the command (base64 only);
          # the machine prints one marked line of match / differs / absent /
          # present words. stdout goes to a 0600 scratch file that only
          # parse-compare reads; stderr is only classified; both are deleted.
          fly_machine_check() {
            local rc cls out
            out=machine.json
            if [ "$1" = after ]; then out=machine-after.json; fi
            set +e
            flyctl ssh console -a "${APP}" -C "$(cat compare.cmd)" > ssh-stdout.txt 2> fly-ssh-stderr.txt
            rc=$?
            set -e
            if [ "${rc}" -ne 0 ]; then
              cls=$(fly_error_class fly-ssh-stderr.txt)
              printf '{"unavailable":true,"errorClass":"%s"}\n' "${cls}" > "${out}"
              echo "::warning::flyctl ssh console failed (exit ${rc}, error class ${cls}), so the in-machine value check did not run and deployed values are unproven. flyctl's own output is withheld from this log. $(fly_error_hint "${cls}")"
            else
              "${FEM[@]}" parse-compare "${MANIFEST}" "${RULES}" . "$1"
            fi
            rm -f ssh-stdout.txt fly-ssh-stderr.txt
          }
          # END fly_helpers
          fly_list_state fly-state-staged.tsv "the staged state could not be verified (the stage step already succeeded; staging again is safe)" || exit 1
          "${FEM[@]}" verify "${MANIFEST}" "${RULES}" . staged

      - name: Apply staged changes now (apply mode with deploy_staged=true)
        if: ${{ inputs.mode == 'apply' && inputs.deploy_staged }}
        env:
