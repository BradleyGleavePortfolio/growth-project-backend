name: SBOM (CycloneDX)

# Generates a CycloneDX SBOM on every push to main and on every release tag
# and uploads it as a workflow artifact, kept for 90 days per CISA SBOM
# guidance. Future: could submit to Dependency-Track via a DT_SERVER_URL
# secret if one is configured — no such submission step exists today.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps only
        run: npm ci --omit=dev

      - name: Install @cyclonedx/cdxgen
        # Exact version pin (not @10) so SBOM output format stays reproducible
        # across runs. --no-audit dropped so npm surfaces advisories on the
        # generator's own dependency tree.
        run: npm install --no-save --no-fund @cyclonedx/cdxgen@10.11.0

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          npx cdxgen -o sbom.cdx.json -t nodejs -r .
          ls -lh sbom.cdx.json

      - name: Summarize SBOM
        run: |
          COMPONENTS=$(jq '.components | length' sbom.cdx.json)
          {
            echo "## SBOM summary"
            echo ''
            echo "Components: **$COMPONENTS**"
            echo ''
            echo "Top 10 by name (alpha):"
            jq -r '.components | sort_by(.name) | .[0:10] | .[] | "- \(.name)@\(.version // "?")"' sbom.cdx.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact (90-day retention)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
