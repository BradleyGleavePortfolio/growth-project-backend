name: Fly Feature Flags Set (operator)

# Operator workflow that flips the importer-wave feature flags on the
# production Fly app via `fly secrets set` / `fly secrets unset`. Triggered
# manually via workflow_dispatch only — never on push/PR — matching the
# pattern of the existing Fly Secrets Set (operator) workflow.
#
# What it does:
#   1. Pushes ONLY the names the operator explicitly set this dispatch —
#      never all of them unconditionally (S12-B6 review closure,
#      S12B6-SOL-B1). Every flag/deadline/allowlist input below is a closed
#      choice whose default is `unchanged`, meaning "leave this one alone"
#      (same convention as fly-deploy.yml's `migrations` acknowledgement
#      input: the default is never a default-on switch). A name left at
#      `unchanged` is OMITTED from the flyctl invocation entirely, so Fly
#      leaves that secret's current value untouched — `flyctl secrets set`
#      only ever touches the names you pass it, it is not a full-replace.
#   2. If `pilot_allowlist=clear`, runs `flyctl secrets unset
#      FEATURE_SCOUT_PILOT_COACH_IDS` FIRST (S9-B2 C1 hardening: an unset
#      name is unambiguous at the app — undefined → empty allowlist → nobody
#      admitted — whereas an empty-string value relied on unproven Fly API
#      behaviour). Then, if at least one name was set, pushes those in ONE
#      `flyctl secrets set` invocation. Each flyctl mutation restarts the
#      machines once, so a dispatch that both clears and sets restarts twice.
#   3. Verifies with `fly secrets list --json`: every name SET this run must
#      be present, and a name UNSET this run must be ABSENT. Only the names
#      touched this run and their Fly deployment status are printed — never
#      values, never digests, never the rest of the app's secret listing
#      (S9B-584-B1 / C4).
#
# Why every input is a closed `type: choice` (S9A2-584-B1 closure):
#   GitHub renders every workflow_dispatch input value, and every step
#   `env:` value that is not a secret, in PLAIN TEXT in the public Actions
#   run record and log (the "Run ..." group prints the `env:` map; see real
#   run 29031011035 of this workflow). This repository is public. A
#   free-text input could therefore carry an accidental sensitive paste
#   (a token, a client value) into the permanent public run record BEFORE
#   any in-job validator could reject it. So this workflow has NO free-text
#   input at all: every input is a `type: choice` with a fixed option list.
#   The UI offers only the dropdown, and the API/`gh workflow run` path
#   rejects a value outside the option list with HTTP 422 ("not in the list
#   of allowed values") before any run is created. The in-job validators
#   below still re-check every value against the same closed sets — that is
#   defence in depth, not the boundary. The selected option names (e.g.
#   `true`, `300000`, `SET`) do appear in the public log; they are
#   non-sensitive by construction.
#
# Where the allowlist VALUE comes from (S9B-584-A1 closure):
#   The pilot coach allowlist — a list of client User.id UUIDs — is NOT a
#   workflow input. It is read from the encrypted GitHub Actions secret
#   `FEATURE_SCOUT_PILOT_COACH_IDS`, which GitHub masks (`***`) wherever it
#   would otherwise appear, and which this workflow never prints anyway (it
#   prints only an entry COUNT). The operator sets that secret with
#   `gh secret set FEATURE_SCOUT_PILOT_COACH_IDS --env production` (an
#   ENVIRONMENT secret, readable only by jobs bound to `production`, like
#   this one — a repository-level secret of the same name would also
#   resolve but is readable by any job) and then dispatches with
#   `pilot_allowlist=push-from-secret`.
#
# S12-B6 / S9A584-B1 note on the allowlist grammar: the app's parser
# (parsePilotCoachAllowlist in src/common/feature-flag/pilot-coach-allowlist.ts)
# is fail-closed — ONE malformed entry empties the WHOLE list and nobody is
# admitted. A workflow that pushes a value the app rejects therefore causes
# a silent pilot outage. So the validator below accepts a value ONLY if the
# app would admit every entry: it splits on commas exactly like the app,
# trims each entry, and requires the app's canonical 8-4-4-4-12 hex UUID
# (case-insensitive). It is deliberately STRICTER than the app in the
# harmless direction: it also rejects newlines, carriage returns, tabs,
# quotes and backslashes anywhere in the value, and empty segments
# (leading/trailing/double commas), which the app would merely drop. The
# app remains the source of truth at request time; this check only stops a
# bad value from reaching Fly. test/ci/s12b6-fly-feature-flags.spec.ts runs
# this exact step and the app parser over one shared case table.
#
# Deadline choices: every option is a value ScoutLifecycleService.readDeadlineMs
# accepts (/^[1-9][0-9]{0,9}$/); the validator re-checks both the closed set
# and that grammar, so no option can ever be one the app silently ignores.
#   300000 = 5 min (the app default), 900000 = 15 min, 1800000 = 30 min,
#   3600000 = 60 min.
#
# How to run (operator) — set only what you mean to change, e.g. push the
# allowlist from the secret and nothing else:
#   gh secret set FEATURE_SCOUT_PILOT_COACH_IDS --env production   # prompts; paste the CSV of UUIDs
#   gh workflow run "Fly Feature Flags Set (operator)" \
#     -f app=backend-spring-lake-3890 \
#     -f confirm=SET \
#     -f pilot_allowlist=push-from-secret
#
# ...or set every name explicitly:
#   gh workflow run "Fly Feature Flags Set (operator)" \
#     -f app=backend-spring-lake-3890 \
#     -f confirm=SET \
#     -f feature_scout_ingest=true \
#     -f feature_scout_reconstruct=false \
#     -f feature_extension_pairing=true \
#     -f pilot_allowlist=clear \
#     -f scout_run_deadline_ms=300000

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production). Closed list — only the production app.
        required: true
        type: choice
        default: backend-spring-lake-3890
        options:
          - backend-spring-lake-3890
      confirm:
        description: >-
          Select SET to confirm you intend to change production flags. The
          default `no` aborts before any validator or Fly call.
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - SET
      feature_scout_ingest:
        description: >-
          FEATURE_SCOUT_INGEST: `true` / `false` to set it, `unchanged` to
          keep its CURRENT Fly value (no default-on mutation).
        required: false
        type: choice
        default: unchanged
        options:
          - unchanged
          - 'true'
          - 'false'
      feature_extension_pairing:
        description: >-
          FEATURE_EXTENSION_PAIRING: `true` / `false` to set it, `unchanged`
          to keep its CURRENT Fly value (no default-on mutation).
        required: false
        type: choice
        default: unchanged
        options:
          - unchanged
          - 'true'
          - 'false'
      feature_scout_reconstruct:
        description: >-
          FEATURE_SCOUT_RECONSTRUCT: `true` / `false` to set it, `unchanged`
          to keep its CURRENT Fly value (no default-on mutation).
        required: false
        type: choice
        default: unchanged
        options:
          - unchanged
          - 'true'
          - 'false'
      pilot_allowlist:
        description: >-
          FEATURE_SCOUT_PILOT_COACH_IDS (S12-B1 allowlist). The VALUE is never
          an input (this log is public): `unchanged` keeps the CURRENT Fly
          value; `push-from-secret` pushes the value of the GitHub Actions
          secret FEATURE_SCOUT_PILOT_COACH_IDS (set it first with `gh secret
          set FEATURE_SCOUT_PILOT_COACH_IDS --env production`), after
          validating it with the app's exact grammar; `clear` UNSETS the
          secret on Fly (pilot surface goes dark for everyone).
        required: false
        type: choice
        default: unchanged
        options:
          - unchanged
          - push-from-secret
          - clear
      scout_run_deadline_ms:
        description: >-
          SCOUT_RUN_DEADLINE_MS, the run deadline window in milliseconds:
          300000 (5 min, app default), 900000 (15 min), 1800000 (30 min) or
          3600000 (60 min) — every option is exactly what
          ScoutLifecycleService.readDeadlineMs accepts. `unchanged` keeps
          the CURRENT Fly value (no default-on mutation).
        required: false
        type: choice
        default: unchanged
        options:
          - unchanged
          - '300000'
          - '900000'
          - '1800000'
          - '3600000'

permissions:
  contents: read

jobs:
  fly-feature-flags-set:
    name: Push feature flags to Fly
    runs-on: ubuntu-latest
    # Production-mutating: bound to the same `production` environment as Fly Deploy
    # so required reviewers (once configured) gate this too, not only image deploys.
    # The FEATURE_SCOUT_PILOT_COACH_IDS environment secret is only readable here.
    environment: production
    concurrency: fly-secrets-${{ inputs.app }}
    defaults:
      run:
        # Explicit so every step runs as `bash --noprofile --norc -eo pipefail`
        # and the spec can execute each run: block under exactly the same
        # shell options (S9B-584-B3).
        shell: bash
    steps:
      - name: Validate Fly app target
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          # `app` is a one-option choice; this is the defence-in-depth re-check.
          case "${APP}" in
            backend-spring-lake-3890) ;;
            *)
              echo "::error::app input is not an allowed Fly app target. Aborting."
              exit 1
              ;;
          esac
          echo "App target allowed."

      - name: Confirm operator intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # `confirm` is a choice [no, SET] defaulting to `no`: a dispatch that
          # did not explicitly select SET aborts here, before any validator or
          # Fly call.
          if [ "${CONFIRM}" != "SET" ]; then
            echo "::error::confirm input must be the literal string 'SET' (the default 'no' does not confirm). Aborting."
            exit 1
          fi
          echo "Operator confirmed."

      - name: Validate flag values (unchanged = leave alone, S12B6-SOL-B1)
        env:
          SCOUT: ${{ inputs.feature_scout_ingest }}
          RECONSTRUCT: ${{ inputs.feature_scout_reconstruct }}
          PAIRING: ${{ inputs.feature_extension_pairing }}
        run: |
          # Each flag is a closed choice [unchanged, true, false]. `unchanged`
          # means "not specified this dispatch, leave the current Fly value
          # alone" — not a value, so it never reaches the flyctl command
          # below. Anything other than exactly 'unchanged', 'true' or 'false'
          # (including an empty string, which the choice type should make
          # impossible) is rejected. This re-check is defence in depth behind
          # GitHub's own option-list enforcement (S9A2-584-B1).
          #
          # On rejection, name the OFFENDING INPUT by name only; this script
          # never interpolates the value into its own output.
          check_one() {
            local input_name="$1" v="$2"
            case "${v}" in
              unchanged)
                echo "${input_name}: unchanged, leaving current Fly value untouched."
                ;;
              true|false)
                echo "${input_name}: valid boolean, will be set."
                ;;
              *)
                echo "::error::${input_name} must be exactly 'true', 'false', or 'unchanged' — the supplied value is not one of the choice options."
                return 1
                ;;
            esac
          }
          ok=0
          check_one "feature_scout_ingest" "${SCOUT}" || ok=1
          check_one "feature_scout_reconstruct" "${RECONSTRUCT}" || ok=1
          check_one "feature_extension_pairing" "${PAIRING}" || ok=1
          if [ "${ok}" -ne 0 ]; then
            exit 1
          fi

      - name: Validate scout run deadline (unchanged = leave alone)
        env:
          DEADLINE: ${{ inputs.scout_run_deadline_ms }}
        run: |
          # Closed choice [unchanged, 300000, 900000, 1800000, 3600000]. The
          # value must be one of the four listed options AND match
          # ScoutLifecycleService.readDeadlineMs exactly
          # (src/scout/lifecycle/lifecycle.service.ts: /^[1-9][0-9]{0,9}$/,
          # anything else silently falls back to the 300000 ms default) — so
          # no option can ever be a value the app would ignore, and no value
          # outside the dropdown reaches Fly even via the API path.
          if [ "${DEADLINE}" = "unchanged" ]; then
            echo "scout_run_deadline_ms: unchanged, leaving current Fly value untouched."
            exit 0
          fi
          case "${DEADLINE}" in
            300000|900000|1800000|3600000) ;;
            *)
              echo "::error::scout_run_deadline_ms must be one of 300000, 900000, 1800000, 3600000, or 'unchanged' — the supplied value is not one of the choice options."
              exit 1
              ;;
          esac
          if ! [[ "${DEADLINE}" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::scout_run_deadline_ms is not a value ScoutLifecycleService.readDeadlineMs accepts (positive integer, no leading zeros, at most 10 digits)."
            exit 1
          fi
          echo "scout_run_deadline_ms: valid choice (${DEADLINE} ms), will be set."

      - name: Validate pilot coach allowlist (from secret; never an input)
        env:
          ALLOWLIST_MODE: ${{ inputs.pilot_allowlist }}
          # Secret, not input: GitHub masks it in the rendered log and this
          # script never prints it (only an entry count). S9B-584-A1.
          COACH_IDS: ${{ secrets.FEATURE_SCOUT_PILOT_COACH_IDS }}
        run: |
          # Three distinct meanings (S12B6-SOL-B1):
          #   unchanged        -> leave the current Fly value alone.
          #   clear            -> deliberately go dark for everyone (unset).
          #   push-from-secret -> push the GitHub secret's value, validated
          #                       below with the app's exact grammar
          #                       (S9A584-B1 / S9B-584-B2).
          case "${ALLOWLIST_MODE}" in
            unchanged)
              echo "pilot_allowlist: unchanged, leaving current Fly value untouched."
              ;;
            clear)
              echo "pilot_allowlist: clear — will UNSET FEATURE_SCOUT_PILOT_COACH_IDS on Fly (pilot surface goes dark for everyone)."
              ;;
            push-from-secret)
              if [ -z "${COACH_IDS}" ]; then
                echo "::error::pilot_allowlist=push-from-secret but the GitHub Actions secret FEATURE_SCOUT_PILOT_COACH_IDS is empty or not configured for the production environment. Set it with: gh secret set FEATURE_SCOUT_PILOT_COACH_IDS --env production. Nothing was pushed."
                exit 1
              fi
              # Reject control characters, quotes and backslashes anywhere in
              # the value up front. The app parser rejects any entry that
              # still contains them after trim() (a quoted id, a newline in
              # the middle, a backslash) and would empty the WHOLE list.
              # Rejecting them everywhere (even a trailing newline the app
              # would trim away) is stricter only in the harmless direction.
              if [[ "${COACH_IDS}" == *$'\n'* || "${COACH_IDS}" == *$'\r'* || "${COACH_IDS}" == *$'\t'* \
                    || "${COACH_IDS}" == *\"* || "${COACH_IDS}" == *\'* || "${COACH_IDS}" == *\\* ]]; then
                echo "::error::FEATURE_SCOUT_PILOT_COACH_IDS secret contains a newline, carriage return, tab, quote or backslash. The app's parser fails the WHOLE list closed on any such entry (S12-B1) — fix the secret first so the pilot is not silently locked out. Nothing was pushed."
                exit 1
              fi
              uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
              # Split on commas EXACTLY like the app (String.prototype.split).
              # `read -a` would drop a trailing empty field, so split by
              # walking the string instead; every segment, including empty
              # ones from a leading/trailing/double comma, is inspected.
              rest="${COACH_IDS}"
              count=0
              bad=0
              while :; do
                if [[ "${rest}" == *,* ]]; then
                  raw="${rest%%,*}"
                  rest="${rest#*,}"
                  more=1
                else
                  raw="${rest}"
                  more=0
                fi
                # trim() with pure parameter expansion (no xargs: it would
                # strip quotes and backslashes and hide them from the check).
                entry="${raw#"${raw%%[! ]*}"}"
                entry="${entry%"${entry##*[! ]}"}"
                if [ -z "${entry}" ] || ! [[ "${entry}" =~ ${uuid_re} ]]; then
                  bad=1
                else
                  count=$((count + 1))
                fi
                if [ "${more}" -eq 0 ]; then
                  break
                fi
              done
              if [ "${bad}" -eq 1 ]; then
                echo "::error::FEATURE_SCOUT_PILOT_COACH_IDS secret has an entry that is not a canonical UUID (or an empty segment from a leading/trailing/double comma). The app's parser fails the WHOLE list closed on any bad entry (S12-B1) — fix the secret first so the pilot is not silently locked out. Nothing was pushed."
                exit 1
              fi
              echo "pilot_allowlist: push-from-secret — ${count} entr(y/ies) validated with the app's grammar; will be set."
              ;;
            *)
              echo "::error::pilot_allowlist must be one of unchanged, push-from-secret, clear."
              exit 1
              ;;
          esac

      - name: Check Fly token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — cannot manage secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured."

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-09-20 (pinned)

      - name: Push feature flags to Fly (only inputs explicitly set this dispatch)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          SCOUT: ${{ inputs.feature_scout_ingest }}
          RECONSTRUCT: ${{ inputs.feature_scout_reconstruct }}
          PAIRING: ${{ inputs.feature_extension_pairing }}
          DEADLINE: ${{ inputs.scout_run_deadline_ms }}
          ALLOWLIST_MODE: ${{ inputs.pilot_allowlist }}
          COACH_IDS: ${{ secrets.FEATURE_SCOUT_PILOT_COACH_IDS }}
        run: |
          set +x
          # S12B6-SOL-B1 closure: build the `flyctl secrets set` argument
          # list from only the names that were explicitly set. `flyctl
          # secrets set` only ever touches the names it is given — a name
          # left at `unchanged` keeps its current value on Fly untouched.
          # This is the update-only mechanism the review asked for: no name,
          # no change. Every element is `NAME=value` with a fixed literal
          # NAME, so no value can be read as a flyctl option. Each value is
          # re-checked against its closed choice set here as well (defence
          # in depth, S9A2-584-B1): this step never forwards a value the
          # validators above would not have accepted.
          args=()
          pushed=()
          unset_names=()
          add_flag() {
            local input_name="$1" fly_name="$2" v="$3"
            case "${v}" in
              unchanged) ;;
              true|false)
                args+=("${fly_name}=${v}")
                pushed+=("${fly_name}")
                ;;
              *)
                echo "::error::${input_name} is not one of unchanged/true/false. Nothing was pushed."
                return 1
                ;;
            esac
          }
          add_flag "feature_scout_ingest" "FEATURE_SCOUT_INGEST" "${SCOUT}"
          add_flag "feature_scout_reconstruct" "FEATURE_SCOUT_RECONSTRUCT" "${RECONSTRUCT}"
          add_flag "feature_extension_pairing" "FEATURE_EXTENSION_PAIRING" "${PAIRING}"
          case "${DEADLINE}" in
            unchanged) ;;
            300000|900000|1800000|3600000)
              args+=("SCOUT_RUN_DEADLINE_MS=${DEADLINE}")
              pushed+=("SCOUT_RUN_DEADLINE_MS")
              ;;
            *)
              echo "::error::scout_run_deadline_ms is not one of the choice options. Nothing was pushed."
              exit 1
              ;;
          esac
          case "${ALLOWLIST_MODE}" in
            unchanged) ;;
            clear)
              # S9-B2 C1 hardening: unset, not `NAME=`. Not an error on Fly if
              # the name is already absent (flyctl appsecrets.Update).
              unset_names+=("FEATURE_SCOUT_PILOT_COACH_IDS")
              ;;
            push-from-secret)
              if [ -z "${COACH_IDS}" ]; then
                echo "::error::pilot_allowlist=push-from-secret but the FEATURE_SCOUT_PILOT_COACH_IDS secret is empty. Nothing was pushed."
                exit 1
              fi
              args+=("FEATURE_SCOUT_PILOT_COACH_IDS=${COACH_IDS}")
              pushed+=("FEATURE_SCOUT_PILOT_COACH_IDS")
              ;;
            *)
              echo "::error::pilot_allowlist must be one of unchanged, push-from-secret, clear. Nothing was pushed."
              exit 1
              ;;
          esac
          if [ "${#args[@]}" -eq 0 ] && [ "${#unset_names[@]}" -eq 0 ]; then
            echo "::error::No flag, allowlist or deadline input was set this dispatch — nothing to push. Set at least one input, or use Fly Secrets List to inspect current values without changing anything."
            exit 1
          fi
          # Order: unset first, then set. Under -e a failed unset stops the
          # step before anything is set; a failed set after a successful
          # unset leaves the job red with the allowlist already cleared
          # (dark), never a false green. The two never touch the same name
          # (clear and push-from-secret are one choice).
          if [ "${#unset_names[@]}" -gt 0 ]; then
            echo "Unsetting ${#unset_names[@]} name(s): ${unset_names[*]}"
            flyctl secrets unset -a "${APP}" FEATURE_SCOUT_PILOT_COACH_IDS
            echo "UNSET_NAMES=${unset_names[*]}" >> "${GITHUB_ENV}"
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            echo "Pushing ${#pushed[@]} name(s): ${pushed[*]}"
            flyctl secrets set -a "${APP}" "${args[@]}"
            echo "PUSHED_NAMES=${pushed[*]}" >> "${GITHUB_ENV}"
          fi

      - name: Verify pushed names are present on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set +x
          # S9B-584-B1 closure: parse `flyctl secrets list --json` (an array
          # of {name, digest[, status]}) with jq instead of the human table,
          # whose rows begin with a `*`/`!` staging marker and box-drawing
          # columns that made the old `awk '{print $1}'` never match a name.
          # Print ONLY the names touched this run and their status — not the
          # listing, not digests (a digest of a low-entropy value such as
          # `true` identifies it, and equal digests reveal equal secrets).
          # Presence (for set names) and ABSENCE (for unset names) is what
          # this step certifies. Fly's status column (Deployed / Staged /
          # Partial / Unknown, or absent on older flyctl) is reported
          # truthfully as-is and does not by itself fail the step: right
          # after `secrets set`, Fly may still report Staged while the
          # machines restart.
          if [ -z "${PUSHED_NAMES:-}" ] && [ -z "${UNSET_NAMES:-}" ]; then
            echo "::error::PUSHED_NAMES and UNSET_NAMES are both empty — the push step did not record what it changed, so nothing can be verified."
            exit 1
          fi
          listing_json="$(flyctl secrets list -a "${APP}" --json)"
          if ! printf '%s' "${listing_json}" | jq -e 'type == "array"' > /dev/null; then
            echo "::error::flyctl secrets list --json did not return a JSON array; cannot verify."
            exit 1
          fi
          missing=""
          not_deployed=""
          still_present=""
          for name in ${PUSHED_NAMES:-}; do
            status="$(printf '%s' "${listing_json}" | jq -r --arg n "${name}" '[.[] | select(.name == $n)] | if length == 0 then "__MISSING__" else (.[0].status // "unknown") end')"
            if [ "${status}" = "__MISSING__" ]; then
              echo "${name}: MISSING on Fly"
              missing="${missing} ${name}"
            else
              echo "${name}: present on Fly (status: ${status})"
              if [ "${status}" != "Deployed" ]; then
                not_deployed="${not_deployed} ${name}"
              fi
            fi
          done
          for name in ${UNSET_NAMES:-}; do
            if printf '%s' "${listing_json}" | jq -e --arg n "${name}" 'any(.[]; .name == $n)' > /dev/null; then
              echo "${name}: STILL PRESENT on Fly after unset"
              still_present="${still_present} ${name}"
            else
              echo "${name}: absent on Fly (unset confirmed)"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Names pushed this run did not appear on Fly after set:${missing}"
            exit 1
          fi
          if [ -n "${still_present}" ]; then
            echo "::error::Names unset this run are still present on Fly:${still_present}"
            exit 1
          fi
          if [ -n "${not_deployed}" ]; then
            echo "::warning::Present on Fly but Fly does not yet report status Deployed for:${not_deployed}. Machines restart after secrets set; re-check with the Fly Secrets List workflow if the pilot does not see the change."
          fi
          if [ -n "${PUSHED_NAMES:-}" ]; then
            echo "Every name pushed this run (${PUSHED_NAMES}) is present on Fly."
          fi
          if [ -n "${UNSET_NAMES:-}" ]; then
            echo "Every name unset this run (${UNSET_NAMES}) is absent from Fly."
          fi
