name: Fly Feature Flags Set (operator)

# Operator workflow that flips the importer-wave feature flags on the
# production Fly app via `fly secrets set`. Triggered manually via
# workflow_dispatch only — never on push/PR — matching the pattern of
# the existing Fly Secrets Set (operator) workflow.
#
# What it does:
#   1. Pushes FEATURE_SCOUT_INGEST and FEATURE_EXTENSION_PAIRING to Fly
#      in one `fly secrets set` invocation so machines restart once.
#      Both values are non-sensitive booleans read at request time by
#      src/common/feature-flag/feature-flag-not-found.middleware.ts.
#   2. Validates by running `fly secrets list` and checking both names
#      are present. Only names and digests are printed, never values.
#   3. Optionally sets or removes FEATURE_DUNNING_V2 (Smart Dunning v2,
#      read by src/checkout/dunning-v2/dunning-v2.feature.ts). The
#      input is a closed choice: `unchanged` (default) never touches it,
#      `true` sets it in the same `fly secrets set` call, `unset` removes
#      it (rollback to v1 dunning). Validation then checks the name is
#      present (true) or absent (unset).
#
# How to run (operator):
#   gh workflow run "Fly Feature Flags Set (operator)" \
#     -f app=backend-spring-lake-3890 \
#     -f confirm=SET \
#     -f feature_scout_ingest=true \
#     -f feature_extension_pairing=true \
#     -f feature_dunning_v2=unchanged

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production)
        required: true
        default: backend-spring-lake-3890
      confirm:
        description: Type SET to confirm you intend to change production flags
        required: true
        default: ''
      feature_scout_ingest:
        description: Value for FEATURE_SCOUT_INGEST (true/false)
        required: true
        default: 'true'
      feature_extension_pairing:
        description: Value for FEATURE_EXTENSION_PAIRING (true/false)
        required: true
        default: 'true'
      feature_dunning_v2:
        description: >-
          Smart Dunning v2 (FEATURE_DUNNING_V2). unchanged = do not touch;
          true = enable; unset = remove the secret (rollback to v1).
        type: choice
        required: true
        default: unchanged
        options:
          - unchanged
          - 'true'
          - unset

permissions:
  contents: read

jobs:
  fly-feature-flags-set:
    name: Push feature flags to Fly
    runs-on: ubuntu-latest
    # Production-mutating: bound to the same `production` environment as Fly Deploy
    # so required reviewers (once configured) gate this too, not only image deploys.
    environment: production
    concurrency: fly-secrets-${{ inputs.app }}
    steps:
      - name: Validate Fly app target
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          case "${APP}" in
            backend-spring-lake-3890) ;;
            *)
              echo "::error::app input is not an allowed Fly app target. Aborting."
              exit 1
              ;;
          esac
          echo "App target allowed."

      - name: Confirm operator intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "SET" ]; then
            echo "::error::confirm input must be the literal string 'SET'. Aborting."
            exit 1
          fi
          echo "Operator confirmed."

      - name: Validate flag values
        env:
          SCOUT: ${{ inputs.feature_scout_ingest }}
          PAIRING: ${{ inputs.feature_extension_pairing }}
          DUNNING_V2: ${{ inputs.feature_dunning_v2 }}
        run: |
          case "${DUNNING_V2}" in
            unchanged|true|unset) ;;
            *)
              echo "::error::feature_dunning_v2 must be unchanged, true or unset — got '${DUNNING_V2}'."
              exit 1
              ;;
          esac
          for v in "${SCOUT}" "${PAIRING}"; do
            case "${v}" in
              true|false) ;;
              *)
                echo "::error::Flag values must be exactly 'true' or 'false' — got '${v}'."
                exit 1
                ;;
            esac
          done
          echo "Flag values are valid booleans."

      - name: Check Fly token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — cannot manage secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured."

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master 2026-09-20 (pinned)

      - name: Push feature flags to Fly
        env:
          DUNNING_V2: ${{ inputs.feature_dunning_v2 }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          SCOUT: ${{ inputs.feature_scout_ingest }}
          PAIRING: ${{ inputs.feature_extension_pairing }}
        run: |
          set +x
          extra=()
          case "${DUNNING_V2}" in
            unchanged|unset) ;;
            true) extra+=("FEATURE_DUNNING_V2=true") ;;
            *) echo "::error::feature_dunning_v2 must be unchanged, true or unset."; exit 1 ;;
          esac
          flyctl secrets set -a "${APP}" \
            FEATURE_SCOUT_INGEST="${SCOUT}" \
            FEATURE_EXTENSION_PAIRING="${PAIRING}" \
            "${extra[@]}"
          if [ "${DUNNING_V2}" = "unset" ]; then
            # Only unset when present: unsetting a missing name is an error.
            if flyctl secrets list -a "${APP}" | awk '{print $1}' | grep -qx FEATURE_DUNNING_V2; then
              flyctl secrets unset -a "${APP}" FEATURE_DUNNING_V2
            else
              echo "FEATURE_DUNNING_V2 is already absent; nothing to unset."
            fi
          fi

      - name: Validate flag names exist on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          DUNNING_V2: ${{ inputs.feature_dunning_v2 }}
        run: |
          set +x
          listing=$(flyctl secrets list -a "${APP}")
          echo "${listing}"
          names=$(echo "${listing}" | awk '{print $1}')
          missing=""
          for name in FEATURE_SCOUT_INGEST FEATURE_EXTENSION_PAIRING; do
            if ! echo "${names}" | grep -qx "${name}"; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Flags did not appear on Fly after set:${missing}"
            exit 1
          fi
          echo "Both feature flag names are present on Fly."
          case "${DUNNING_V2}" in
            true)
              if ! echo "${names}" | grep -qx FEATURE_DUNNING_V2; then
                echo "::error::FEATURE_DUNNING_V2 did not appear on Fly after set."
                exit 1
              fi
              echo "FEATURE_DUNNING_V2 is present on Fly."
              ;;
            unset)
              if echo "${names}" | grep -qx FEATURE_DUNNING_V2; then
                echo "::error::FEATURE_DUNNING_V2 is still on Fly after unset."
                exit 1
              fi
              echo "FEATURE_DUNNING_V2 is absent on Fly."
              ;;
            *) echo "FEATURE_DUNNING_V2 left unchanged." ;;
          esac
