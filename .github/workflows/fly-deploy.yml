# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7

      # Fail loudly when the Fly deploy environment is missing the API token.
      # A green-but-skipped run looks identical to a real deploy in the GitHub
      # UI, which is how production drifted stale on prior pushes. We'd rather
      # the workflow turn red and force the operator to provision the secret
      # than mask a missing-prod-deploy as success.
      #
      # Operator setup (one-time): see docs/deploy-runbook.md §8.
      #   1. Create a Fly deploy token: `fly tokens create deploy -a <app>`
      #   2. GitHub → Settings → Secrets and variables → Actions → New
      #      repository secret. Name: FLY_API_TOKEN. Value: the token from (1).
      #   3. Re-run this workflow (Actions → Fly Deploy → Run workflow) or push
      #      a new commit to main to trigger deploy.
      #
      # We also reject obvious placeholder values (empty / "<...>" / "changeme"
      # / "REPLACE_ME"). The shell never prints the token value itself.
      - name: Verify FLY_API_TOKEN is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN GitHub Actions secret is not set."
            echo "Production deploy cannot proceed. See docs/deploy-runbook.md §8 for the provisioning steps."
            exit 1
          fi
          case "${FLY_API_TOKEN}" in
            '<'*'>'|'changeme'|'REPLACE_ME'|'placeholder'|'TODO')
              echo "::error::FLY_API_TOKEN looks like a placeholder value, not a real Fly deploy token."
              echo "Generate a real token with: fly tokens create deploy -a <app>"
              echo "See docs/deploy-runbook.md §8."
              exit 1
              ;;
          esac
          # Length sanity check — real Fly deploy tokens are well over 20 chars.
          # The token itself is never printed; only its length is logged.
          tok_len=${#FLY_API_TOKEN}
          if [ "${tok_len}" -lt 20 ]; then
            echo "::error::FLY_API_TOKEN is suspiciously short (length=${tok_len}). Refusing to deploy."
            exit 1
          fi
          echo "FLY_API_TOKEN present (length=${tok_len})."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy with Sentry sourcemap upload wired in. RELEASE_VERSION is the
      # commit SHA — it lands as both a Docker build arg (so the build-time
      # script tags the upload) and an ENV in the runtime image (so
      # instrument.ts attaches the same release to captured events).
      #
      # SENTRY_AUTH_TOKEN is passed via `--build-secret` rather than
      # `--build-arg` so the token is mounted only for the upload RUN
      # and never persists in any image layer.
      #
      # If SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are unset,
      # scripts/sentry-upload-sourcemaps.sh no-ops gracefully and the build
      # still succeeds. See README.md §Sentry sourcemaps for setup.
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          flyctl deploy --remote-only \
            --build-arg RELEASE_VERSION="${GITHUB_SHA}" \
            --build-arg SENTRY_DSN="${SENTRY_DSN}" \
            --build-arg SENTRY_ORG="${SENTRY_ORG}" \
            --build-arg SENTRY_PROJECT="${SENTRY_PROJECT}" \
            --build-secret sentry_auth_token="${SENTRY_AUTH_TOKEN}"
