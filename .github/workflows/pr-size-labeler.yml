name: pr-size-labeler
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  pull-requests: write
  contents: read
# A new commit cancels this PR's older labelling run. An edited event gets a group
# of its own run id: size-label-action ignores edited, so it must never cancel one.
concurrency:
  group: pr-size-${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: |
            {
              "0": "size/XS",
              "50": "size/S",
              "150": "size/M",
              "300": "size/L",
              "400": "size/XL"
            }
          ignored: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml
            *.lock
            **/*.generated.ts
