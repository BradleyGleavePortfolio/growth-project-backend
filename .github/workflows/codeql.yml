name: codeql
# CodeQL JS/TS static analysis (R98 — security baseline).
#
# This workflow is intentionally tolerant of repositories where GitHub
# Advanced Security (the SARIF-upload feature that surfaces findings in
# the Security tab) is not enabled. The scan still runs and produces
# build-log diagnostics; the analyze/upload step is allowed to fail
# without failing the PR check. When the operator enables Advanced
# Security the same workflow begins uploading findings to the Security
# tab with no code change required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL JS/TS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      # Step-level continue-on-error: lets the SARIF upload fail
      # (when GitHub Advanced Security isn't enabled) without marking
      # the PR check red. The scan itself still runs and emits findings
      # to the job log for operator review.
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
