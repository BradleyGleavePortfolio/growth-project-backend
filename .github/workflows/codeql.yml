name: codeql
# CodeQL JS/TS static analysis (R98 — security baseline). Fail-closed.
#
# The analyze step uploads SARIF to code scanning and must succeed. There is
# no GHAS-state fallback: on 2026-09-14 this workflow uploaded results for
# main (run 34836630579), so the sink is known to work; any future upload or
# analysis failure turns the check red instead of being downgraded to a
# warning. The release gate (scripts/ci/release-evidence-gate.sh) separately
# requires an uploaded analysis for the exact released commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL JS/TS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
