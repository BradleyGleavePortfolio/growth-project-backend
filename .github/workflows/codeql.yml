name: codeql
# CodeQL JS/TS static analysis (R98 — security baseline).
#
# This workflow is intentionally tolerant of repositories where GitHub
# Advanced Security (the SARIF-upload feature that surfaces findings in
# the Security tab) is not enabled. The scan still runs and produces
# build-log diagnostics; the upload step is allowed to fail without
# failing the PR check. When the operator enables Advanced Security
# the same workflow begins uploading findings without code changes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL JS/TS
    runs-on: ubuntu-latest
    # Allow the job to complete green even if the SARIF upload fails because
    # Advanced Security is not enabled. The scan output is still visible in
    # the job log for operator review.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
