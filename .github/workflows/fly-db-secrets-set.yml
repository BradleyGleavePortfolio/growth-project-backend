name: Fly DB Secrets Set (operator)

# Operator workflow that pushes database-related secrets to the production
# Fly app via `fly secrets set`. Used after rotating the Supabase database
# password, or when bootstrapping a backend with DATABASE_URL / DIRECT_URL /
# APPLE_NONCE_REQUIRED for the first time.
#
# Triggered manually via workflow_dispatch only.
#
# What it does:
#   1. Reads the sensitive values from GitHub Actions secrets:
#        - DATABASE_URL          (Postgres connection string for runtime)
#        - DIRECT_URL            (Postgres connection string for migrations)
#        - APPLE_NONCE_REQUIRED  (Sign in with Apple nonce verification flag)
#      Fails loudly if any are missing.
#   2. Pushes them to Fly in one `fly secrets set` invocation so the app
#      only restarts once.
#   3. Validates by running `fly secrets list` and confirming the names
#      are present. Values are never echoed.
#
# How to run (operator):
#   gh workflow run "Fly DB Secrets Set (operator)" \
#     -f app=backend-spring-lake-3890 \
#     -f confirm=SET
#
# The `confirm` input must equal the literal string `SET` to guard
# against accidental dispatch from the GitHub UI.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production)
        required: true
        default: backend-spring-lake-3890
      confirm:
        description: Type SET to confirm you intend to write production secrets
        required: true
        default: ''

permissions:
  contents: read

jobs:
  fly-db-secrets-set:
    name: Push DB secrets to Fly
    runs-on: ubuntu-latest
    concurrency: fly-secrets-${{ inputs.app }}
    steps:
      - name: Confirm operator intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "SET" ]; then
            echo "::error::confirm input must be the literal string 'SET' — got something else. Aborting."
            exit 1
          fi
          echo "Operator confirmed."

      - name: Check Fly token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — cannot manage secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured."

      - name: Check required GitHub Actions secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPLE_NONCE_REQUIRED: ${{ secrets.APPLE_NONCE_REQUIRED }}
        run: |
          set +x
          missing=()
          [ -z "${DATABASE_URL}" ]         && missing+=("DATABASE_URL")
          [ -z "${DIRECT_URL}" ]           && missing+=("DIRECT_URL")
          [ -z "${APPLE_NONCE_REQUIRED}" ] && missing+=("APPLE_NONCE_REQUIRED")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them in: Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required GitHub Actions secrets are present."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Push DB secrets to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPLE_NONCE_REQUIRED: ${{ secrets.APPLE_NONCE_REQUIRED }}
        run: |
          set +x
          flyctl secrets set -a "${APP}" \
            DATABASE_URL="${DATABASE_URL}" \
            DIRECT_URL="${DIRECT_URL}" \
            APPLE_NONCE_REQUIRED="${APPLE_NONCE_REQUIRED}"

      - name: Validate secret names exist on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set +x
          listing=$(flyctl secrets list -a "${APP}")
          echo "${listing}"

          expected=(
            DATABASE_URL
            DIRECT_URL
            APPLE_NONCE_REQUIRED
          )

          names=$(echo "${listing}" | awk -F'│' '{gsub(/^[[:space:]!]+|[[:space:]]+$/, "", $1); print $1}')
          missing=()
          for name in "${expected[@]}"; do
            if ! echo "${names}" | grep -qx "${name}"; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets did not appear on Fly after set: ${missing[*]}"
            exit 1
          fi
          echo "All expected DB secret names are present on Fly."
