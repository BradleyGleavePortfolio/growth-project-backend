name: Fly Launch Env Set (operator)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production)
        required: true
        default: backend-spring-lake-3890
      confirm:
        description: Type SET to confirm
        required: true

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    # Production-mutating: bound to the same `production` environment as Fly Deploy
    # so required reviewers (once configured) gate this too, not only image deploys.
    environment: production
    concurrency: fly-secrets-${{ inputs.app }}
    steps:
      - name: Validate Fly app target
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          case "${APP}" in
            backend-spring-lake-3890) ;;
            *)
              echo "::error::app input is not an allowed Fly app target. Aborting."
              exit 1
              ;;
          esac
          echo "App target allowed."

      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "SET" ]; then
            echo "Confirmation not provided; aborting."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master 2026-09-20 (pinned)
      - name: Set launch env vars
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_NAME: ${{ inputs.app }}
          V_PII_SALT: ${{ secrets.GUEST_CHECKOUT_PII_SALT }}
          V_LANDING: ${{ secrets.LANDING_VIEW_HASH_SECRET }}
          V_CHECKOUT: ${{ secrets.CHECKOUT_RECOVERY_SECRET }}
          V_CENTS: ${{ secrets.COACH_AI_MAX_ACTUAL_CENTS }}
          V_MULT: ${{ secrets.COACH_AI_VALUE_MULTIPLIER }}
          V_ANDROID: ${{ secrets.ANDROID_CERT_SHA256_FINGERPRINTS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME}" ]; then echo "App name is empty; aborting."; exit 1; fi
          for pair in "GUEST_CHECKOUT_PII_SALT=$V_PII_SALT" "LANDING_VIEW_HASH_SECRET=$V_LANDING" "CHECKOUT_RECOVERY_SECRET=$V_CHECKOUT" "COACH_AI_MAX_ACTUAL_CENTS=$V_CENTS" "COACH_AI_VALUE_MULTIPLIER=$V_MULT"; do
            name="${pair%%=*}"; val="${pair#*=}"
            if [ -z "$val" ]; then echo "Missing GH secret for $name; aborting."; exit 1; fi
          done
          args=(
            "GUEST_CHECKOUT_PII_SALT=$V_PII_SALT"
            "LANDING_VIEW_HASH_SECRET=$V_LANDING"
            "CHECKOUT_RECOVERY_SECRET=$V_CHECKOUT"
            "COACH_AI_MAX_ACTUAL_CENTS=$V_CENTS"
            "COACH_AI_VALUE_MULTIPLIER=$V_MULT"
          )
          if [ -n "$V_ANDROID" ]; then
            args+=("ANDROID_CERT_SHA256_FINGERPRINTS=$V_ANDROID")
            echo "Including ANDROID_CERT_SHA256_FINGERPRINTS."
          else
            echo "ANDROID_CERT_SHA256_FINGERPRINTS not set in repo secrets; skipping."
          fi
          flyctl secrets set "${args[@]}" --app "${APP_NAME}"
