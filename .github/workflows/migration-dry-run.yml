name: Migration Dry-Run

# R106 (AGENT_RULES) — every PR that touches prisma/migrations/** must prove
# the migration applies cleanly AND has a reversible counterpart (or an
# explicit IRREVERSIBLE annotation). Grandfather clause: migrations
# committed before this workflow shipped are exempt; only NEW directories
# created in this PR are checked.
#
# ─────────────────────────────────────────────────────────────────────────
# WORKFLOW SPLIT — apply vs schema-parity (Op 49 Part 1 / Part 2 codified)
# ─────────────────────────────────────────────────────────────────────────
# Context (pre-launch, ZERO live users — the product has not GA'd):
#   PR #487 landed Op 49 "Part 1": the forward migration chain now applies
#   cleanly (`npx prisma migrate deploy` -> exit 0) against a disposable
#   Postgres with the Supabase-equivalent bootstrap. What that fix EXPOSED
#   (it did not introduce) is "Part 2": ~114 pre-existing schema-parity
#   drift items between the applied migration chain and prisma/schema.prisma,
#   surfaced by `prisma migrate diff ... --exit-code`. That drift never ran
#   on main before, because main's chain never applied, so the diff step was
#   never reached.
#
# Why this file used to be ONE job named "Forward migration applies cleanly":
#   it bundled the apply step AND the schema-parity (`migrate diff`) step in a
#   single job. After Part 1 the apply passes but the bundled diff fails on
#   the ~114 deferred drift items, so the single gate showed RED on unrelated
#   PRs (e.g. H3 #459) purely because of the verify-schema step — not because
#   the apply path was broken. That conflated a real, required signal (does
#   the chain apply?) with a deferred, tracked one (is the chain at parity
#   with schema.prisma?).
#
# The split below separates the two concerns into two independently-named
# jobs:
#   * migrations-apply        — "Forward migrations apply cleanly"
#                               REQUIRED status check. Must be green.
#   * migrations-schema-parity — "Schema parity (deferred to
#                               BL-MIGRATION-REBASELINE)"
#                               INFORMATIONAL only — must NOT block merge.
#
# Why schema-parity is non-blocking (and HOW):
#   The ~114-item drift is tracked as the BL-MIGRATION-REBASELINE launch-gate
#   item in BACKLOG.md (filed in PR #486). It is a launch-gate item with no
#   time trigger — resolving it requires production / schema-architecture
#   decisions (destructive FK drops, central User-model redesign, partial
#   unique-index policy, etc. — see docs/runbooks/
#   migration-chain-repair-2026-06-24.md Part 2). Until BL-MIGRATION-REBASELINE
#   lands, forcing this gate red would block every unrelated PR on debt it did
#   not create. So the diff step runs with `continue-on-error: true`, and a
#   final summary step ALWAYS runs (`if: always()`), prints a real,
#   human-readable drift count, and exits 0 — the job stays VISIBLE and prints
#   actionable output, but its overall conclusion is green-with-drift-summary,
#   never a silent skip and never a fake-clean checkmark (R109).
#   We chose `continue-on-error` on the diff step + an `if: always()` summary
#   step (rather than a bare step-level swallow) because it keeps the raw diff
#   output in the log, keeps the drift COUNT in the job summary, and makes the
#   "deferred, not clean" status legible to a human reading the checks list.
#
# FLIP-BACK CONDITION (make schema-parity blocking again):
#   When BL-MIGRATION-REBASELINE merges and the chain reaches parity
#   (`prisma migrate diff ... --exit-code` -> 0), the migrations-schema-parity
#   job MUST be flipped back to blocking: remove `continue-on-error: true`
#   from the "Verify schema matches schema.prisma" step, delete the
#   `if: always()` summary-step exit-0 shim, and add migrations-schema-parity
#   to main's required status checks. Re-flipping this job to blocking MUST be
#   part of BL-MIGRATION-REBASELINE's acceptance criteria (R125 — this split
#   is itself an enforcement-layer change, so the enforcer that makes it real
#   again travels with the backlog item).
#
# Behavior:
#   1. migrations-apply: spin up a disposable Postgres, run the
#      Supabase-equivalent bootstrap, then apply ALL migrations forward
#      (`npx prisma migrate deploy`). Grandfather clause: if this PR touches
#      zero files under prisma/migrations/**, a forward-deploy failure is
#      treated as pre-existing debt on the base branch (warning, not error),
#      so the gate cannot block unrelated PRs on bugs they did not introduce.
#      Any PR that DOES modify prisma/migrations/** still fails hard on a
#      broken forward-deploy.
#   2. migrations-schema-parity: same disposable Postgres + bootstrap + apply,
#      then `prisma migrate diff --from-url $DATABASE_URL
#      --to-schema-datamodel prisma/schema.prisma --exit-code`. Informational
#      only until BL-MIGRATION-REBASELINE lands (see above). The SAME
#      grandfather clause applies here as in migrations-apply — it is mirrored
#      verbatim, neither tightened nor loosened.
#   3. reversibility-check: detect migration directories added in this PR.
#      For each NEW directory, require either:
#        - a sibling `down.sql` file, OR
#        - a `-- IRREVERSIBLE: <reason>` line in migration.sql.
#      Directories with NEITHER fail (grandfathered dirs are never checked
#      because only PR-added dirs enter the loop).
#   4. For each NEW directory that DOES ship a `down.sql`, prove real
#      reversibility: apply all migrations forward, snapshot the schema
#      (pg_dump -s), apply that directory's down.sql, re-apply the same
#      migration forward, snapshot again, and require the two schema dumps
#      to be byte-identical. A down.sql that does not faithfully reverse the
#      migration (e.g. a `-- placeholder`) makes the re-applied schema differ
#      and fails the job. This replaces an earlier existence-only check that
#      gave false rollback assurance.
#
# This protects ops from a class of "shipped a migration, can't roll back"
# incidents that bite when a deploy goes sideways at 2 a.m.

on:
  pull_request:
    paths:
      - 'prisma/migrations/**'
      - '.github/workflows/migration-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migration-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-apply:
    name: Forward migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: migration_dryrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure postgresql-client is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap Supabase-equivalent environment (CI only)
        # Production runs on Supabase-managed Postgres, which provides the
        # `auth` schema (auth.uid()) and the service_role/authenticated/anon
        # roles. The bare postgres:15.18 service used here provides none of
        # them, so the committed migrations that reference those objects
        # cannot apply without this scaffolding. The bootstrap script is
        # idempotent and lives at prisma/migrations/_supabase_bootstrap.sql
        # (leading underscore => Prisma's migration engine ignores it; it is
        # NOT a migration). Strip the ?schema= query param because psql does
        # not accept it as a libpq URI parameter.
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/_supabase_bootstrap.sql

      - name: Detect migration changes in this PR
        id: detect_migration_changes
        # Grandfather clause: this apply gate exists to catch NEW migrations
        # that fail to apply. Pre-existing breakage on main (e.g. a migration
        # ordering bug shipped before this gate landed) is not this PR's fault
        # and must not block unrelated PRs. We compare the PR's
        # prisma/migrations/** tree against the merge base; if the PR adds,
        # modifies, or renames zero migration files, any forward-deploy
        # failure is pre-existing debt and gets surfaced as a warning rather
        # than a hard fail.
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          # List files under prisma/migrations/** that changed in this PR.
          # Use --diff-filter=AMRCD: Added, Modified, Renamed, Copied, Deleted.
          # Deletions MUST count as a migration touch — a PR that only deletes
          # migrations was previously classified pr_touches_migrations=false and
          # silently slipped past the hard-fail path.
          CHANGED=$(git diff --name-only --diff-filter=AMRCD "$BASE_SHA"..."$HEAD_SHA" -- 'prisma/migrations/**' 2>/dev/null || true)
          DELETED=$(git diff --name-only --diff-filter=D "$BASE_SHA"..."$HEAD_SHA" -- 'prisma/migrations/**' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "pr_touches_migrations=true" >> "$GITHUB_OUTPUT"
            echo "This PR modifies prisma/migrations:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
          else
            echo "pr_touches_migrations=false" >> "$GITHUB_OUTPUT"
            echo "This PR does not touch prisma/migrations — any forward-deploy failure is pre-existing debt."
          fi
          # Hard-fail policy: deleting committed migrations is forbidden without
          # explicit operator approval (R106). Fail BEFORE the apply step so a
          # deletion-only PR never reaches the grandfather path.
          if [ -n "$DELETED" ]; then
            echo "migration_deletion=true" >> "$GITHUB_OUTPUT"
            echo "::error::Migration deletion detected in this PR. Deleting committed migrations is forbidden without explicit operator approval (R106). Files:"
            printf '%s\n' "$DELETED" | sed 's/^/  /'
            exit 1
          fi
          echo "migration_deletion=false" >> "$GITHUB_OUTPUT"

      - name: Apply all migrations forward
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx prisma migrate deploy 2>&1 | tee migrate_deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Decide pass/fail based on PR scope
        env:
          PR_TOUCHES_MIGRATIONS: ${{ steps.detect_migration_changes.outputs.pr_touches_migrations }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          if [ "$APPLY_OUTCOME" = "success" ]; then
            echo "::notice::Forward migration applied cleanly."
            exit 0
          fi
          if [ "$PR_TOUCHES_MIGRATIONS" = "true" ]; then
            echo "::error::Forward migration failed AND this PR modifies prisma/migrations — this PR is responsible."
            echo "::error::See migrate_deploy.log above for the failure detail."
            exit 1
          fi
          echo "::warning::Forward migration failed, but this PR does not touch prisma/migrations."
          echo "::warning::This is pre-existing debt on the base branch and is NOT this PR's fault."
          echo "::warning::Track it as a separate fix-migration-ordering task; this gate passes for unrelated PRs."
          exit 0

  migrations-schema-parity:
    name: Schema parity (deferred to BL-MIGRATION-REBASELINE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # INFORMATIONAL ONLY — must NOT block merge until BL-MIGRATION-REBASELINE
    # lands (see the top-of-file comment block for the full rationale and the
    # exact flip-back condition). This job intentionally runs even though it
    # is non-blocking, so the ~114-item drift stays VISIBLE and prints a real,
    # actionable summary (R109) — it is never skipped, never silently green.
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: migration_dryrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure postgresql-client is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap Supabase-equivalent environment (CI only)
        # Identical to migrations-apply: the bare postgres service lacks the
        # Supabase `auth` schema + roles the committed migrations reference, so
        # the chain cannot apply without this idempotent bootstrap. Strip the
        # ?schema= query param because psql does not accept it as a libpq URI
        # parameter.
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/_supabase_bootstrap.sql

      - name: Detect migration changes in this PR
        id: detect_migration_changes
        # Grandfather clause — MIRRORED VERBATIM from migrations-apply, neither
        # tightened nor loosened. If this PR touches zero files under
        # prisma/migrations/**, an apply failure here is pre-existing debt on
        # the base branch, not this PR's fault, and must not be treated as a
        # PR-introduced regression. (Schema parity is informational regardless,
        # but the clause is mirrored so the two jobs classify PR scope
        # identically.)
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          # List files under prisma/migrations/** that changed in this PR.
          # Use --diff-filter=AMRCD: Added, Modified, Renamed, Copied, Deleted.
          # Deletions MUST count as a migration touch — a PR that only deletes
          # migrations was previously classified pr_touches_migrations=false and
          # silently slipped past the hard-fail path.
          CHANGED=$(git diff --name-only --diff-filter=AMRCD "$BASE_SHA"..."$HEAD_SHA" -- 'prisma/migrations/**' 2>/dev/null || true)
          DELETED=$(git diff --name-only --diff-filter=D "$BASE_SHA"..."$HEAD_SHA" -- 'prisma/migrations/**' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "pr_touches_migrations=true" >> "$GITHUB_OUTPUT"
            echo "This PR modifies prisma/migrations:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
          else
            echo "pr_touches_migrations=false" >> "$GITHUB_OUTPUT"
            echo "This PR does not touch prisma/migrations — any forward-deploy failure is pre-existing debt."
          fi
          # Hard-fail policy: deleting committed migrations is forbidden without
          # explicit operator approval (R106). Fail BEFORE the apply step so a
          # deletion-only PR never reaches the grandfather path.
          if [ -n "$DELETED" ]; then
            echo "migration_deletion=true" >> "$GITHUB_OUTPUT"
            echo "::error::Migration deletion detected in this PR. Deleting committed migrations is forbidden without explicit operator approval (R106). Files:"
            printf '%s\n' "$DELETED" | sed 's/^/  /'
            exit 1
          fi
          echo "migration_deletion=false" >> "$GITHUB_OUTPUT"

      - name: Apply all migrations forward
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx prisma migrate deploy 2>&1 | tee migrate_deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify schema matches schema.prisma
        id: schema_diff
        # INFORMATIONAL ONLY (continue-on-error). This is the ~114-item
        # schema-parity drift exposed by Op 49 Part 1 and tracked as
        # BL-MIGRATION-REBASELINE (BACKLOG.md; filed in PR #486). It runs only
        # when the forward apply succeeded — otherwise the diff would compare
        # against an empty/partial DB and emit confusing noise. The drift count
        # is captured into a SQL script (--script) so the summary step below
        # can report a real, human-readable number. To flip this job back to
        # blocking once BL-MIGRATION-REBASELINE lands: remove
        # `continue-on-error: true` here and delete the exit-0 shim in the
        # summary step below, then add migrations-schema-parity to main's
        # required status checks.
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Capture the drift as a migration script so we can both (a) honour
          # the original --exit-code contract via $? and (b) count the drift
          # statements for a human-readable summary. `migrate diff --script`
          # emits the DDL that WOULD reconcile the applied DB to schema.prisma;
          # an empty script means zero drift.
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > schema_parity_drift.sql 2> schema_parity_diff.log
          DIFF_RC=$?
          set -e
          echo "diff_exit_code=$DIFF_RC" >> "$GITHUB_OUTPUT"
          # Count drift statements: non-comment, non-blank lines ending in `;`.
          if [ -f schema_parity_drift.sql ]; then
            DRIFT_COUNT=$(grep -cE ';[[:space:]]*$' schema_parity_drift.sql || true)
          else
            DRIFT_COUNT=0
          fi
          echo "drift_count=$DRIFT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Schema-parity diff exit code: $DIFF_RC"
          echo "Schema-parity drift statements detected: $DRIFT_COUNT"
          # Re-run the canonical --exit-code form for the log of record so the
          # raw original contract is still visible in CI output.
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          echo "(--exit-code form returned $? — non-zero means drift; informational)"
          set -e

      - name: Schema-parity summary (non-blocking; surfaces deferred drift)
        # ALWAYS runs so the job's overall conclusion is success (green) while
        # still printing a real, actionable summary of the deferred drift —
        # never a silent skip, never a fake-clean checkmark (R109). This is the
        # exit-0 shim referenced in the flip-back instructions above: deleting
        # this step's `exit 0` (and the continue-on-error on the diff step) is
        # what makes schema parity blocking again once BL-MIGRATION-REBASELINE
        # lands.
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          DIFF_OUTCOME: ${{ steps.schema_diff.outcome }}
          DIFF_RC: ${{ steps.schema_diff.outputs.diff_exit_code }}
          DRIFT_COUNT: ${{ steps.schema_diff.outputs.drift_count }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Schema parity (deferred to BL-MIGRATION-REBASELINE)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$APPLY_OUTCOME" != "success" ]; then
            MSG="schema-parity: SKIPPED diff — forward apply did not succeed (apply outcome: ${APPLY_OUTCOME:-unknown}). Drift cannot be measured against an empty/partial DB."
            echo "::warning::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            # Non-blocking job: apply-path failures are owned by the
            # migrations-apply REQUIRED check, not here.
            exit 0
          fi
          COUNT="${DRIFT_COUNT:-unknown}"
          if [ "${DIFF_RC:-1}" = "0" ] && [ "$COUNT" = "0" ]; then
            MSG="schema-parity drift: 0 items — migration chain is at parity with prisma/schema.prisma. BL-MIGRATION-REBASELINE may be ready to close; flip this job back to blocking."
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 0
          fi
          MSG="schema-parity drift: ${COUNT} items pending BL-MIGRATION-REBASELINE (see BACKLOG.md). This check is INFORMATIONAL and intentionally non-blocking pre-launch; it does NOT gate merge until BL-MIGRATION-REBASELINE lands (full reconciliation script: schema_parity_drift.sql in this job's logs)."
          echo "::warning::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # Exit 0 on purpose — see the flip-back instructions in the step
          # comment above and the top-of-file comment block.
          exit 0

  reversibility-check:
    name: New migrations are reversible (or explicitly marked IRREVERSIBLE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: migrations-apply
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: migration_dryrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/migration_dryrun?schema=public
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure postgresql-client is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1 || ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          pg_dump --version

      - name: Identify NEW migration directories in this PR
        id: diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Not a PR context; nothing to check."
            echo "new_dirs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t NEW < <(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'prisma/migrations/*/migration.sql' | xargs -I{} dirname {} | sort -u || true)
          if [ ${#NEW[@]} -eq 0 ]; then
            echo "No new migration directories in this PR. Skipping."
            echo "new_dirs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf "Found %d new migration directories:\n" "${#NEW[@]}"
          printf "  - %s\n" "${NEW[@]}"
          {
            echo "new_dirs<<EOF"
            printf '%s\n' "${NEW[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce reversibility + prove schema parity on each NEW migration
        if: steps.diff.outputs.new_dirs != ''
        env:
          # Passed via env (not inline ${{ }} expansion in the shell body) so a
          # migration directory name containing shell metacharacters cannot be
          # injected into the script text. See R75 / GitHub Actions script
          # injection guidance.
          NEW_DIRS: ${{ steps.diff.outputs.new_dirs }}
        run: |
          set -euo pipefail

          # psql / pg_dump reject the `?schema=<name>` query parameter that
          # Prisma appends to DATABASE_URL — it is a Prisma-specific extension,
          # not a libpq URI. Strip it before invoking either tool. Mirrors the
          # same strip performed earlier in this workflow for _supabase_bootstrap.
          PSQL_URL="${DATABASE_URL%%\?*}"

          PSQL="psql --no-psqlrc -v ON_ERROR_STOP=1 -X -q $PSQL_URL"
          DUMP="pg_dump --schema-only --no-owner --no-privileges $PSQL_URL"

          # Reset DB to an empty public schema, then apply every migration
          # forward via prisma. Echoes nothing sensitive.
          reset_and_migrate_forward() {
            $PSQL -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;' >/dev/null
            npx prisma migrate deploy >/dev/null
          }

          FAIL=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo ""
            echo "==> Checking $dir"

            has_down=0
            [ -f "$dir/down.sql" ] && has_down=1

            if [ "$has_down" -eq 0 ]; then
              if grep -qE '^-- IRREVERSIBLE:' "$dir/migration.sql"; then
                REASON=$(grep -E '^-- IRREVERSIBLE:' "$dir/migration.sql" | head -1 | sed 's/^-- IRREVERSIBLE: //')
                echo "  OK: marked IRREVERSIBLE — $REASON"
                continue
              fi
              echo "  FAIL: $dir lacks both down.sql AND '-- IRREVERSIBLE: <reason>' marker."
              echo "        Add one of the two. See AGENT_RULES.md R106."
              FAIL=1
              continue
            fi

            # down.sql present — prove it actually reverses the migration.
            echo "  down.sql present — verifying forward → down → forward schema parity."

            reset_and_migrate_forward
            BEFORE=$(mktemp)
            $DUMP > "$BEFORE"

            echo "  Applying $dir/down.sql ..."
            if ! $PSQL -f "$dir/down.sql" >/dev/null; then
              echo "  FAIL: $dir/down.sql did not apply cleanly."
              FAIL=1
              continue
            fi

            echo "  Re-applying $dir/migration.sql ..."
            if ! $PSQL -f "$dir/migration.sql" >/dev/null; then
              echo "  FAIL: re-applying $dir/migration.sql after down.sql failed."
              FAIL=1
              continue
            fi

            AFTER=$(mktemp)
            $DUMP > "$AFTER"

            if diff -u "$BEFORE" "$AFTER" > schema-parity.diff; then
              echo "  OK: schema is byte-identical after forward → down → forward."
            else
              echo "  FAIL: $dir/down.sql does not faithfully reverse migration.sql."
              echo "        Schema differs after re-applying forward:"
              sed 's/^/        /' schema-parity.diff
              FAIL=1
            fi
          done <<< "$NEW_DIRS"

          exit "$FAIL"
