name: Dependency Audit

# WHY: the repo had no recurring dependency-vulnerability gate — only a
# historical manual snapshot, which is not a gate (R33/R113/R94; 50-failures
# #10). WHAT: the npm CLI's native audit exit contract over the committed
# lockfile, fail closed on vulnerability AND on infrastructure failure.
# Weekly npm is partial R94 coverage, not Socket/Snyk, ownership or CVE-age triage.
#
# Bounded decision: any high/critical advisory blocks immediately. That is
# STRICTER than R113's seven-day grace; advisory age is NOT measured.
#
# Exceptions (operator ruling OR-114-2, 2026-10-02): the ONLY exception
# mechanism is .github/audit-exceptions.json, evaluated by the checked-in
# scripts/ci/audit-gate.mjs over the JSON of this same whole-graph audit. An
# entry applies only to its exact GHSA id and package, only before its expiry
# (at most 31 days out), only if EVERY lockfile copy of the package and every
# lockfile node of every covered finding is dev-only, only up to max_version,
# and only while the registry has no patched release (a patch FAILS the job:
# upgrade and delete the exception). A finding is covered only if every
# advisory in its via chain is excepted. Applied exceptions are printed as
# warnings. Moderate/low stay non-blocking. Contract: test/ci/audit-gate.spec.ts
# and test/ci/dependency-audit.spec.ts. Edits to any of these files are T4.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1' # Monday 09:17 UTC; active only on the default branch.

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Reported check name for branch protection (this repo lists job names as
    # required contexts). Remote wiring is out of scope here.
    name: npm audit (high+critical, whole graph)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pins reused from already-reviewed workflows in this repo
      # (r100-quality-gate.yml, danger.yml): immutable SHAs, never tags.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # The audit needs no token; do not leave one in the runner's git config.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Confirmed runtime, pinned to the patch for reproducibility (R114/R124).
          node-version: '20.20.1'
      - name: Record Node and npm versions
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
      - name: Audit whole locked dependency graph (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # Whole graph, stated explicitly: --include beats any ambient --omit /
          # NODE_ENV=production config, and --package-lock-only audits the
          # committed lockfile without needing node_modules — so nothing
          # installs and no dependency lifecycle script runs just to audit it.
          # Flags per npm v10 docs: https://docs.npmjs.com/cli/v10/commands/npm-audit/
          # npm's exit code is CAPTURED, never discarded: the gate fails on any
          # exit other than 0/1, on unreadable/error JSON, and on an exit that
          # disagrees with the findings. The gate's own exit is the verdict
          # (set -e): no fallback, no soft-fail.
          audit_json="${RUNNER_TEMP:?RUNNER_TEMP is not set}/npm-audit.json"
          audit_exit=0
          timeout 300 npm audit --package-lock-only \
            --include=prod --include=dev --include=optional --include=peer \
            --audit-level=high --json >"$audit_json" || audit_exit=$?
          node scripts/ci/audit-gate.mjs \
            --audit "$audit_json" --audit-exit "$audit_exit" \
            --lockfile package-lock.json --exceptions .github/audit-exceptions.json
