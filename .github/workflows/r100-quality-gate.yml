name: R100 Quality Gate

# Retains the R75 banned-token control under canonical G01/G08/G21.
# Universal LOC/test-density quotas and their title exemptions are retired.
# The committed checker and policy are shared with the pre-commit hook;
# this workflow does not replace behavioral tests or other safety checks.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: r100-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banned-casts:
    name: Banned cast tokens (R75 / R100.A2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.1'
      - name: Diff banned tokens
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch carries no pull-request base. Rather than fabricate
          # one (which would silently certify an unmeasured diff), this run is
          # declared NON-CERTIFYING and does not assert R75 compliance.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "NON-CERTIFYING RUN: event '$EVENT_NAME' provides no pull-request base."
            echo "R75 / R100.A2 was NOT measured. Only the pull_request run certifies R75."
            exit 0
          fi
          # In pull_request context a missing/malformed base is an infrastructure
          # failure, never an empty diff that passes.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "FAIL — pull_request event carried no base SHA; refusing to certify R75." >&2
            exit 1
          fi
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "FAIL — pull_request event carried no head SHA; refusing to certify R75." >&2
            exit 1
          fi
          node --version
          # Single committed implementation, shared verbatim with the pre-commit
          # hook. Real Git range semantics (base...head, i.e. merge base) and
          # per-token net counting live in the checker, not in this YAML.
          node scripts/check-r75.js --mode=range --base="$BASE_SHA" --head="$HEAD_SHA"
