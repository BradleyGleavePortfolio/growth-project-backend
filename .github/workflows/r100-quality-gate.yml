name: R100 Quality Gate

# Enforces AGENT_RULES R75 / R104 (banned weak-cast tokens). Runs on every PR;
# required check for merge.
#
# Hard rule (causes failure):
#   - Banned cast tokens (R75 / R100.A2): net positive count in PR diff = P0.
#     No exemptions.
#
# Retired 2026-09-20 (G01/G08 — generic volume quotas are not quality
# evidence): the former `loc-budget` (400 net-LOC cap, [LOC-EXEMPT:] waiver)
# and `test-density` (2.0 test:src ratio, [TEST-EXEMPT:] waiver) jobs. Their
# check names "LOC budget (R100.A3)" and "Test density (R100.A1)" must not be
# listed as required checks; see scripts/setup-branch-protection.sh.
#
# Measurement scope for the banned-cast diff:
#   src/**, scripts/**, test/** (ts/tsx/js/jsx/sh), excluding *.d.ts,
#   node_modules, and *.test.* / *.spec.* files.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: r100-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banned-casts:
    name: Banned cast tokens (R75 / R100.A2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Diff banned tokens
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "Not in PR context; skipping."
            exit 0
          fi
          # Scan scope (R75 / R100.A2): application code, prod scripts, and the
          # Danger config; excludes .d.ts, unit/spec files, and node_modules. No
          # .github/** exclude is needed — every positive pathspec is rooted at
          # src/, scripts/, test/, or dangerfile.js, so the token list cannot
          # self-match a workflow file (asserted in the r100-pathspec spec). The
          # :(glob) prefix makes `**` match zero-or-more segments so top-level
          # files (e.g. src/main.ts) are scanned; a bare src/**/*.ts skips them.
          PATHSPEC=(
            ':(glob)src/**/*.ts' ':(glob)src/**/*.tsx' ':(glob)src/**/*.js' ':(glob)src/**/*.jsx'
            ':(glob)scripts/**/*.ts' ':(glob)scripts/**/*.js' ':(glob)scripts/**/*.sh'
            'dangerfile.js'
            ':(glob)test/**/*.ts' ':(glob)test/**/*.tsx' ':(glob)test/**/*.js'
            ':(exclude,glob)**/*.d.ts'
            ':(exclude,glob)**/node_modules/**'
            ':(exclude,glob)**/*.test.*'
            ':(exclude,glob)**/*.spec.*'
          )
          # Build the added/removed line sets ONCE per side, scoped above.
          ADDED_LINES=$(git diff "$BASE_SHA"...HEAD -- "${PATHSPEC[@]}" | grep -E '^\+[^+]' || true)
          REMOVED_LINES=$(git diff "$BASE_SHA"...HEAD -- "${PATHSPEC[@]}" | grep -E '^-[^-]' || true)

          # Literal banned tokens enumerated in AGENT_RULES R75. Placeholder and
          # seed-data literals are matched here as data; the rule prose elsewhere
          # avoids self-match by living under .github/** which is excluded above.
          TOKENS=(
            "@ts-ignore"
            "@ts-expect-error"
            "as any"
            "as unknown as"
            "as never"
            ".catch(()=>undefined)"
            ".catch(()=>null)"
            ".catch(()=>{})"
            "Coming soon"
            "lorem ipsum"
            "foo@bar"
            "John Doe"
          )
          # @ts-expect-error is permitted ONLY when the same line carries a
          # GitHub issue reference (#NNNN, 4+ digits). Such lines are stripped
          # from the scanned sets before counting so a documented suppression
          # does not trip the gate.
          EXEMPT_RE='@ts-expect-error.*#[0-9]{4,}'
          ADDED_SCAN=$(printf '%s\n' "$ADDED_LINES" | grep -Ev "$EXEMPT_RE" || true)
          REMOVED_SCAN=$(printf '%s\n' "$REMOVED_LINES" | grep -Ev "$EXEMPT_RE" || true)

          ADDED=0
          REMOVED=0
          for tok in "${TOKENS[@]}"; do
            a=$(printf '%s\n' "$ADDED_SCAN" | grep -cF "$tok" || true)
            r=$(printf '%s\n' "$REMOVED_SCAN" | grep -cF "$tok" || true)
            net=$((a - r))
            printf "  %-32s  +%-3d  -%-3d  net %+d\n" "$tok" "$a" "$r" "$net"
            ADDED=$((ADDED + a))
            REMOVED=$((REMOVED + r))
          done

          # Parametrized empty-catch: .catch(<param> => undefined|null|{}) with
          # arbitrary whitespace and parameter names. Counted via regex (grep -E)
          # because the literal list above cannot express a variable parameter.
          EMPTY_CATCH_RE='\.catch\(\s*[^)]*\s*=>\s*(undefined|null|\{\s*\})\s*\)'
          a=$(printf '%s\n' "$ADDED_SCAN" | grep -cE "$EMPTY_CATCH_RE" || true)
          r=$(printf '%s\n' "$REMOVED_SCAN" | grep -cE "$EMPTY_CATCH_RE" || true)
          net=$((a - r))
          printf "  %-32s  +%-3d  -%-3d  net %+d\n" "parametrized-empty-catch" "$a" "$r" "$net"
          ADDED=$((ADDED + a))
          REMOVED=$((REMOVED + r))

          NET=$((ADDED - REMOVED))
          echo ""
          echo "Total: +$ADDED added, -$REMOVED removed, net $NET"
          if [ "$NET" -gt 0 ]; then
            echo ""
            echo "FAIL — R75 violation: this PR adds banned cast tokens (net +$NET)."
            echo "       See AGENT_RULES.md R75 and R104. Fix the underlying type or"
            echo "       narrow with a runtime guard. No exemptions."
            exit 1
          fi
          echo "OK — no net banned-cast additions."
