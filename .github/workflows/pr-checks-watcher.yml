name: PR Checks Watcher

# When all PR checks finish, post a single summary comment that lists
# pass/fail per check. Authors stop scrolling through 20 individual job
# tabs. Comment is updated in place (no spam).
#
# Triggered by check_suite completion rather than individual workflow runs
# so it fires exactly once per push when the full suite is settled.

on:
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  comment:
    if: github.event.check_suite.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize and post comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const pr = context.payload.check_suite.pull_requests[0];
            if (!pr) {
              core.info('No PR associated with this check suite; skipping.');
              return;
            }
            const { data: { check_runs: runs } } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.check_suite.head_sha,
              per_page: 100,
            });
            if (!runs.length) {
              core.info('No check runs found.');
              return;
            }
            const symbol = (r) => {
              if (r.status !== 'completed') return '⏳';
              switch (r.conclusion) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '🚫';
                case 'skipped': return '⏭️';
                case 'neutral': return '➖';
                case 'timed_out': return '⏰';
                default: return '❓';
              }
            };
            const lines = runs
              .sort((a, b) => a.name.localeCompare(b.name))
              .map((r) => `- ${symbol(r)} **${r.name}**${r.conclusion ? ` — ${r.conclusion}` : ''}`);
            const counts = runs.reduce((acc, r) => {
              const k = r.status !== 'completed' ? 'pending' : (r.conclusion || 'unknown');
              acc[k] = (acc[k] || 0) + 1;
              return acc;
            }, {});
            const header = Object.entries(counts).sort().map(([k, v]) => `${k}: ${v}`).join(' · ');
            const marker = '<!-- pr-checks-watcher -->';
            const body = `${marker}\n## CI status — \`${context.payload.check_suite.head_sha.slice(0, 7)}\`\n\n${header}\n\n${lines.join('\n')}\n\n_Updated automatically by pr-checks-watcher._`;

            // Find existing comment to update.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.info('Created new comment.');
            }
