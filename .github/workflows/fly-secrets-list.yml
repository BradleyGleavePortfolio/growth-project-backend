name: Fly Secrets List (operator)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master 2026-09-20 (pinned)
      - name: List secret names
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets list --app "${{ github.event.inputs.app }}"
