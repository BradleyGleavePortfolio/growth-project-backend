# O2 (REL-09): every 10 minutes, probe the public /health and /readyz of
# production and open, refresh or close one GitHub issue labelled
# production-down (scripts/ci/production-uptime.sh). Schedules run only from
# the default branch. Uses only the default GITHUB_TOKEN: no secrets, no fly.
name: Production uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Probe /health and /readyz; open, refresh or close the production-down issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash scripts/ci/production-uptime.sh
