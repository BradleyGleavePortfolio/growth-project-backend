name: Fly Logs Dump (operator)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Fly app name"
        required: true
        default: "backend-spring-lake-3890"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Live-capture a machine boot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -x
          MID=$(flyctl machine list --app "${{ inputs.app }}" --json | python3 -c "import sys,json; ms=json.load(sys.stdin); print([m['id'] for m in ms if m.get('config',{}).get('metadata',{}).get('fly_process_group','app')=='app'][0])")
          echo "machine: $MID"
          (timeout 100 flyctl logs --app "${{ inputs.app }}" > /tmp/live.log 2>&1 || true) &
          LOGPID=$!
          sleep 5
          flyctl machine start "$MID" --app "${{ inputs.app }}" || true
          sleep 90
          kill $LOGPID 2>/dev/null || true
          echo "──────── LIVE BOOT LOGS ────────"
          cat /tmp/live.log
          echo "──────── MACHINE STATUS ────────"
          flyctl machine status "$MID" --app "${{ inputs.app }}" || true
