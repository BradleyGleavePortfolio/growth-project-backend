name: Fly Secrets Set (operator)

# Operator workflow that pushes runtime configuration to the production
# Fly app via `fly secrets set`. Triggered manually via workflow_dispatch
# only — never on push/PR — so it cannot accidentally rotate or overwrite
# secrets as a side effect of a code change.
#
# What it does:
#   1. Reads the unknown/sensitive values from GitHub Actions secrets:
#        - STRIPE_SECRET_KEY
#        - STRIPE_WEBHOOK_SECRET
#        - SENTRY_DSN
#      Fails loudly if any are missing — we never want to ship a half
#      configured production app.
#   2. Pushes those plus the known public, non-sensitive URLs (invite
#      base, signup, store deep-links, CORS origin, Stripe price id) to
#      Fly in one `fly secrets set` invocation. Doing it in one call
#      means Fly only restarts machines once.
#   3. Validates by running `fly secrets list` and checking that every
#      expected name is present. The list command only prints names and
#      digests — it never prints values — so this is safe to log.
#
# What it does NOT do:
#   - It does not deploy. `fly secrets set` does trigger a machine
#     restart on its own, which is the intended effect; no `fly deploy`
#     is invoked.
#   - It does not rotate or generate any keys. Operators rotate Stripe
#     and Sentry credentials in their respective dashboards, then update
#     the GitHub Actions secrets, then re-run this workflow.
#   - It does not echo any secret value. `set +x` is enforced and only
#     names are referenced in shell.
#
# How to run (operator):
#   gh workflow run "Fly Secrets Set (operator)" \
#     -f app=backend-spring-lake-3890 \
#     -f confirm=SET
#
# The `confirm` input must equal the literal string `SET` to guard
# against accidental dispatch from the GitHub UI.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (production)
        required: true
        default: backend-spring-lake-3890
      confirm:
        description: Type SET to confirm you intend to write production secrets
        required: true
        default: ''

permissions:
  contents: read

jobs:
  fly-secrets-set:
    name: Push secrets to Fly
    runs-on: ubuntu-latest
    # Single concurrency group across set + list so two operators can
    # not race each other and observe a half-applied state.
    concurrency: fly-secrets-${{ inputs.app }}
    steps:
      - name: Confirm operator intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "SET" ]; then
            echo "::error::confirm input must be the literal string 'SET' — got something else. Aborting."
            exit 1
          fi
          echo "Operator confirmed."

      - name: Check Fly token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — cannot manage secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured."

      - name: Check required GitHub Actions secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Disable command tracing so values cannot leak via `set -x`.
          set +x
          missing=()
          [ -z "${STRIPE_SECRET_KEY}" ]    && missing+=("STRIPE_SECRET_KEY")
          [ -z "${STRIPE_WEBHOOK_SECRET}" ] && missing+=("STRIPE_WEBHOOK_SECRET")
          [ -z "${SENTRY_DSN}" ]            && missing+=("SENTRY_DSN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them in: Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required GitHub Actions secrets are present."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Push secrets to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          # Sensitive — sourced from GitHub Actions secrets.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Disable command tracing so secret values cannot leak via
          # `set -x` output. flyctl itself does not echo the values it
          # is given on stdin/argv.
          set +x

          # Known public, non-sensitive values are inlined here. They
          # are documented in docs/deploy-runbook.md §1 and intentionally
          # match the durable backend routes shipped in commit 28da843e.
          flyctl secrets set -a "${APP}" \
            PUBLIC_INVITE_BASE_URL=https://app.trygrowthproject.com/join \
            PUBLIC_WEB_SIGNUP_URL=https://app.trygrowthproject.com/signup \
            APP_STORE_URL=https://app.trygrowthproject.com/download/ios \
            PLAY_STORE_URL=https://app.trygrowthproject.com/download/android \
            CORS_ORIGINS=https://console.trygrowthproject.com \
            STRIPE_PRICE_ID_FITNESS=price_1TQij2DUoC5CCVhSDxe9Bin1 \
            BILLING_ENFORCEMENT=enforce \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            SENTRY_DSN="${SENTRY_DSN}"

      - name: Validate secret names exist on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          # `fly secrets list` prints NAME, DIGEST, CREATED AT — never
          # the underlying value — so this output is safe to log.
          set +x
          listing=$(flyctl secrets list -a "${APP}")
          echo "${listing}"

          expected=(
            PUBLIC_INVITE_BASE_URL
            PUBLIC_WEB_SIGNUP_URL
            APP_STORE_URL
            PLAY_STORE_URL
            CORS_ORIGINS
            STRIPE_PRICE_ID_FITNESS
            BILLING_ENFORCEMENT
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            SENTRY_DSN
          )

          missing=()
          for name in "${expected[@]}"; do
            # Anchor on word boundary to avoid matching e.g.
            # STRIPE_SECRET_KEY when looking for STRIPE_SECRET.
            if ! echo "${listing}" | awk '{print $1}' | grep -qx "${name}"; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets did not appear on Fly after set: ${missing[*]}"
            exit 1
          fi
          echo "All expected secret names are present on Fly."
