name: Migration order

# Separate from database CI: this job needs only Git and Node, including on stacks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: migration-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-order:
    name: Migration order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Fetch main and check migration names
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/ci/migration-order.js
