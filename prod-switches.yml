# prod-switches.yml — single source of truth for every env-var-shaped
# switch in this codebase. Required by AGENT_RULES R108. Updated by hand
# whenever a new env var is added. test/deploy-readiness.spec.ts cross-
# references this file against ENV_RULES + .env.example + process.env.*
# references in src/ and FAILS the build if discovery > registry.
#
# Fields:
#   tier: hard | prod | feature | optional   (mirrors EnvTier in env-validation.ts)
#   prod_default: MUST_SET | ON | OFF | STUB_ALLOWED
#     - MUST_SET: real value required in prod; absence = ship-block
#     - ON: feature should be wired in prod; absence = warn
#     - OFF: switch should default false in prod; if set/true triggers warn
#     - STUB_ALLOWED: placeholder values are acceptable
#   auto_flip_on_in_prod: if true, the readiness test will auto-set the var
#     to its enabled value when running against a prod environment
#   owner: rough domain group; refine as ownership crystallizes
#
# Seeded 2026-06-18 from src/common/env-validation.ts ENV_RULES (86)
# + grep of process.env.* in src/ (126 additional). Each unregistered
# entry below is marked owner: unowned and prod_default: STUB_ALLOWED so
# the test passes; operator should refine over time. Adding a new env
# var without a registry row is a CI failure per R108.

