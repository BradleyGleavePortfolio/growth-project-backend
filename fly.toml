# fly.toml app configuration file generated for backend-spring-lake-3890 on 2026-03-14T17:31:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-spring-lake-3890'
primary_region = 'sjc'

[build]

[deploy]
  # Run pending Prisma migrations before booting a new release.
  # Runs in a one-off machine; deploy aborts if this fails, so bad
  # migrations can't take down the running machines.
  release_command = "npx prisma migrate deploy"


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
