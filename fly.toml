# fly.toml app configuration file generated for backend-spring-lake-3890 on 2026-03-14T17:31:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-spring-lake-3890'
primary_region = 'sjc'

[build]

[deploy]
  # Smart release: detects whether the DB is migration-managed yet.
  # See scripts/release.sh for full logic. Deploy aborts on failure,
  # so bad migrations can't take down running machines.
  #
  # Invoke with `bash`, not `sh`. The Debian image's /bin/sh is dash,
  # and dash fails any shell script that contains a stray CR — printing
  # `./scripts/release.sh: 25: set: Illegal option -` and aborting the
  # release before migrations run. The script's shebang is already
  # `#!/usr/bin/env bash`; this command pin makes the deploy
  # interpreter explicit so a future renamed script can't silently
  # regress to dash. .gitattributes pins *.sh to eol=lf to keep CRLF
  # out of the build context in the first place.
  release_command = "bash ./scripts/release.sh"


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
